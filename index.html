<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#1095c1" />
    <title>Tools</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      /* Pull-to-refresh indicator */
      .ptr-indicator {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateY(-100%);
        transition: transform 0.2s ease;
        background: var(--pico-background-color);
        z-index: 1000;
      }

      .ptr-indicator.visible {
        transform: translateY(0);
      }

      .ptr-indicator.refreshing .ptr-arrow {
        display: none;
      }

      .ptr-indicator.refreshing .ptr-spinner {
        display: block;
      }

      .ptr-arrow {
        font-size: 1.5rem;
        transition: transform 0.2s ease;
      }

      .ptr-arrow.flipped {
        transform: rotate(180deg);
      }

      .ptr-spinner {
        display: none;
        width: 24px;
        height: 24px;
        border: 3px solid var(--pico-muted-border-color);
        border-top-color: var(--pico-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .ptr-text {
        margin-left: 0.5rem;
        font-size: 0.9rem;
        color: var(--pico-muted-color);
      }

      /* Content wrapper for pull animation */
      .ptr-content {
        transition: transform 0.2s ease;
      }

      /* Page layout */
      .index-container {
        padding: 1rem 0 6rem;
      }

      /* Tool list - vertical layout matching Streaks habit list */
      .tool-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .tool-list li {
        padding: 0;
        margin: 0;
      }

      .tool-list a {
        display: block;
        padding: 0.8rem 1rem;
        background: var(--pico-card-background-color);
        border-radius: 0.5rem;
        text-decoration: none;
        transition: opacity 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .tool-list a:active {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <!-- Pull-to-refresh indicator -->
    <div class="ptr-indicator" id="ptrIndicator">
      <span class="ptr-arrow" id="ptrArrow">↓</span>
      <div class="ptr-spinner" id="ptrSpinner"></div>
      <span class="ptr-text" id="ptrText">Pull to refresh</span>
    </div>

    <div class="ptr-content" id="ptrContent">
      <main class="container index-container">
        <h1>Tools</h1>
        <ul class="tool-list">
          <li><a href="homescreen/index.html">Homescreen</a></li>
          <li><a href="time-tracking/index.html">Time Tracking</a></li>
          <li><a href="notes/index.html">Notes</a></li>
          <li><a href="localdraw/dist/index.html">LocalDraw</a></li>
          <li><a href="workouts/index.html">Workouts</a></li>
          <li><a href="spidey/index.html">Spidey</a></li>
          <li><a href="rank-it/index.html">Rank it</a></li>
          <li><a href="sleeptimer/index.html">SleepTimer</a></li>
          <li><a href="streaks/index.html">Streaks</a></li>
          <li><a href="torch/index.html">Torch</a></li>
          <li><a href="wheel-of-fortune/index.html">Wheel of Fortune</a></li>
          <li><a href="parrot/index.html">Parrot</a></li>
        </ul>
      </main>
    </div>

    <script>
      // Pull-to-refresh implementation for iOS standalone web apps
      (function() {
        const indicator = document.getElementById('ptrIndicator');
        const arrow = document.getElementById('ptrArrow');
        const text = document.getElementById('ptrText');
        const content = document.getElementById('ptrContent');

        const THRESHOLD = 80;      // pixels to pull before triggering refresh
        const MAX_PULL = 120;      // maximum pull distance
        let startY = 0;
        let currentY = 0;
        let isPulling = false;

        // Only enable on touch devices when at top of page
        function canPull() {
          return window.scrollY === 0;
        }

        document.addEventListener('touchstart', function(e) {
          if (canPull()) {
            startY = e.touches[0].pageY;
            isPulling = true;
          }
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
          if (!isPulling) return;

          currentY = e.touches[0].pageY;
          const pullDistance = currentY - startY;

          // Only activate when pulling down from top
          if (pullDistance > 0 && canPull()) {
            const adjustedPull = Math.min(pullDistance * 0.5, MAX_PULL);

            // Show indicator
            indicator.classList.add('visible');
            content.style.transform = `translateY(${adjustedPull}px)`;
            indicator.style.transform = `translateY(${adjustedPull - 60}px)`;

            // Update text and arrow based on pull distance
            if (adjustedPull >= THRESHOLD) {
              text.textContent = 'Release to refresh';
              arrow.classList.add('flipped');
            } else {
              text.textContent = 'Pull to refresh';
              arrow.classList.remove('flipped');
            }
          }
        }, { passive: true });

        document.addEventListener('touchend', function() {
          if (!isPulling) return;

          const pullDistance = (currentY - startY) * 0.5;

          if (pullDistance >= THRESHOLD) {
            // Trigger refresh
            indicator.classList.add('refreshing');
            text.textContent = 'Refreshing...';

            // Force a hard reload to bypass cache
            setTimeout(function() {
              location.reload(true);
            }, 300);
          } else {
            // Reset without refresh
            indicator.classList.remove('visible');
            content.style.transform = '';
            indicator.style.transform = '';
          }

          isPulling = false;
          startY = 0;
          currentY = 0;
        }, { passive: true });
      })();

      // Register Service Worker for PWA functionality
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(function(registration) {
            // Check for updates on page load
            registration.update();
          })
          .catch(function(error) {
            console.log('ServiceWorker registration failed:', error);
          });
      }
    </script>
  </body>
</html>
