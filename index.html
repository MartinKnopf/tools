<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#574747" />
    <title>Tools</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="stylesheet" href="https://unpkg.com/@knadh/oat/oat.min.css" />
    <script src="https://unpkg.com/@knadh/oat/oat.min.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Pull-to-refresh indicator */
      .ptr-indicator {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateY(-100%);
        transition: transform 0.2s ease;
        background: var(--background);
        z-index: 1000;
      }

      .ptr-indicator.visible {
        transform: translateY(0);
      }

      .ptr-indicator.refreshing .ptr-arrow {
        display: none;
      }

      .ptr-indicator.refreshing .ptr-spinner {
        display: block;
      }

      .ptr-spinner {
        display: none;
        width: 24px;
        height: 24px;
        border: 3px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Tool list layout */
      .tool-list {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-4);
      }

      .tool-list a {
        text-decoration: none;
        transition: opacity 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .tool-list a:active {
        opacity: 0.7;
      }
    </style>
  </head>
  <body data-theme="dark">
    <!-- Pull-to-refresh indicator -->
    <div class="ptr-indicator" id="ptrIndicator">
      <span id="ptrArrow">↓</span>
      <div class="ptr-spinner" id="ptrSpinner"></div>
      <span class="text-light" id="ptrText">Pull to refresh</span>
    </div>

    <main class="container" id="ptrContent">
      <h1>Tools</h1>
      <div class="flex flex-wrap gap-lg tool-list">
        <a class="button" href="homescreen/index.html">Homescreen</a>
        <a class="button" href="time-tracking/index.html">Time Tracking</a>
        <a class="button" href="notes/index.html">Notes</a>
        <a class="button" href="localdraw/dist/index.html">LocalDraw</a>
        <a class="button" href="workouts/index.html">Workouts</a>
        <a class="button" href="spidey/index.html">Spidey</a>
        <a class="button" href="rank-it/index.html">Rank it</a>
        <a class="button" href="sleeptimer/index.html">SleepTimer</a>
        <a class="button" href="streaks/index.html">Streaks</a>
        <a class="button" href="torch/index.html">Torch</a>
        <a class="button" href="wheel-of-fortune/index.html">Wheel of Fortune</a>
        <a class="button" href="parrot/index.html">Parrot</a>
        <a class="button" href="tic-tac-toe/index.html">Tic Tac Toe</a>
        <a class="button" href="connect-4/index.html">Connect 4</a>
        <a class="button" href="strategery/index.html">Strategery</a>
        <a class="button" href="montag/index.html">Montag</a>
        <a class="button" href="snake/index.html">Snake Puzzle</a>
        <a class="button" href="cut/index.html">Cut</a>
        <a class="button" href="note/index.html">Note</a>
        <a class="button" href="stickies/index.html">Stickies</a>
      </div>
    </main>

    <script>
      // Pull-to-refresh implementation for iOS standalone web apps
      (function () {
        const indicator = document.getElementById("ptrIndicator");
        const arrow = document.getElementById("ptrArrow");
        const text = document.getElementById("ptrText");
        const content = document.getElementById("ptrContent");

        const THRESHOLD = 80; // pixels to pull before triggering refresh
        const MAX_PULL = 120; // maximum pull distance
        let startY = 0;
        let currentY = 0;
        let isPulling = false;

        // Only enable on touch devices when at top of page
        function canPull() {
          return window.scrollY === 0;
        }

        document.addEventListener(
          "touchstart",
          function (e) {
            if (canPull()) {
              startY = e.touches[0].pageY;
              isPulling = true;
            }
          },
          { passive: true },
        );

        document.addEventListener(
          "touchmove",
          function (e) {
            if (!isPulling) return;

            currentY = e.touches[0].pageY;
            const pullDistance = currentY - startY;

            // Only activate when pulling down from top
            if (pullDistance > 0 && canPull()) {
              const adjustedPull = Math.min(pullDistance * 0.5, MAX_PULL);

              // Show indicator
              indicator.classList.add("visible");
              content.style.transform = `translateY(${adjustedPull}px)`;
              indicator.style.transform = `translateY(${adjustedPull - 60}px)`;

              // Update text and arrow based on pull distance
              if (adjustedPull >= THRESHOLD) {
                text.textContent = "Release to refresh";
                arrow.style.transform = "rotate(180deg)";
              } else {
                text.textContent = "Pull to refresh";
                arrow.style.transform = "";
              }
            }
          },
          { passive: true },
        );

        document.addEventListener(
          "touchend",
          function () {
            if (!isPulling) return;

            const pullDistance = (currentY - startY) * 0.5;

            if (pullDistance >= THRESHOLD) {
              // Trigger refresh
              indicator.classList.add("refreshing");
              text.textContent = "Refreshing...";

              // Force a hard reload to bypass cache
              setTimeout(function () {
                location.reload(true);
              }, 300);
            } else {
              // Reset without refresh
              indicator.classList.remove("visible");
              content.style.transform = "";
              indicator.style.transform = "";
            }

            isPulling = false;
            startY = 0;
            currentY = 0;
          },
          { passive: true },
        );
      })();

      // Register Service Worker for PWA functionality
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("sw.js")
          .then(function (registration) {
            // Check for updates on page load
            registration.update();
          })
          .catch(function (error) {
            console.log("ServiceWorker registration failed:", error);
          });
      }
    </script>
  </body>
</html>
