<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#574747" />
    <title>Rank it</title>
    <link rel="manifest" href="../manifest.json" />
    <link rel="apple-touch-icon" href="../icons/icon-192.png" />
    <link rel="stylesheet" href="https://unpkg.com/@knadh/oat/oat.min.css" />
    <script src="https://unpkg.com/@knadh/oat/oat.min.js" defer></script>
    <link rel="stylesheet" href="../style.css" />
    <style>
      /* Back button in items view */
      .back-btn {
        width: auto;
      }

      /* List cards */
      .list-card {
        cursor: pointer;
        transition: opacity 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .list-card:active {
        opacity: 0.7;
      }

      .list-card-edit {
        background: none;
        border: none;
        cursor: pointer;
        width: auto;
        flex-shrink: 0;
      }

      .inline-actions button {
        flex: 1;
      }

      /* Item cards */
      .item-card {
        transition: opacity 0.15s ease, transform 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .item-card.dragging {
        opacity: 0.5;
      }

      .item-card.drag-over {
        border-top: 2px solid var(--primary);
      }

      .item-rank {
        min-width: 2rem;
      }

      .item-text {
        cursor: pointer;
      }

      .item-action-btn {
        background: none;
        border: none;
        cursor: pointer;
        width: auto;
      }

      /* Drag handle */
      .drag-handle {
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .drag-handle:active {
        cursor: grabbing;
      }

      .dialog-actions button {
        width: 100%;
      }

      /* Touch drag ghost element */
      .drag-ghost {
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.8;
      }

      /* Drop indicator line */
      .drop-indicator {
        height: 2px;
        pointer-events: none;
      }
    </style>
  </head>
  <body data-theme="dark">
    <main class="container">

      <!-- Lists view -->
      <div id="lists-view">
        <div class="header-row mb-2">
          <h1>Rank it</h1>
          <button class="header-btn" id="add-list-btn" aria-label="Add list">+</button>
        </div>
        <div class="flex flex-col gap-2" id="lists-container"></div>
        <p class="empty-state" id="lists-empty" hidden>
          No lists yet. Tap + to create one.
        </p>
      </div>

      <!-- Items view -->
      <div class="view-hidden" id="items-view">
        <div class="header-row mb-2">
          <button class="back-btn" data-variant="secondary" id="back-btn" aria-label="Back">&larr;</button>
          <h1 id="items-title" class="flex-1 min-w-0 text-ellipsis" style="margin-left:0.8rem;"></h1>
          <button class="header-btn" id="add-item-btn" aria-label="Add item">+</button>
        </div>
        <div class="flex flex-col gap-2" id="items-container"></div>
        <p class="empty-state" id="items-empty" hidden>
          No items yet. Tap + to add one.
        </p>
      </div>

    </main>

    <!-- Add/Rename list dialog -->
    <dialog id="list-dialog">
      <header>
        <h3 id="list-dialog-title">New List</h3>
      </header>
      <section>
        <div class="form-stack">
          <label for="list-name-input">Name</label>
          <input type="text" id="list-name-input" placeholder="List name" />
        </div>
        <div class="dialog-actions">
          <button id="list-dialog-save">Save</button>
          <button data-variant="secondary" id="list-dialog-cancel">Cancel</button>
        </div>
      </section>
    </dialog>

    <!-- Add/Rename item dialog -->
    <dialog id="item-dialog">
      <header>
        <h3 id="item-dialog-title">New Item</h3>
      </header>
      <section>
        <div class="form-stack">
          <label for="item-text-input">Item</label>
          <input type="text" id="item-text-input" placeholder="Item text" />
        </div>
        <div class="dialog-actions">
          <button id="item-dialog-save">Save</button>
          <button data-variant="secondary" id="item-dialog-cancel">Cancel</button>
        </div>
      </section>
    </dialog>

    <script>
      /* ========================================
         Constants and Storage
      ======================================== */
      var STORAGE_KEY = 'rankit_lists';

      /* Load all lists from localStorage */
      function loadLists() {
        var raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      }

      /* Persist all lists to localStorage */
      function saveLists(lists) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(lists));
      }

      /* Generate a simple unique id */
      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }

      /* Escape HTML to prevent XSS */
      function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      /* ========================================
         State
      ======================================== */
      var currentListId = null;    // currently selected list
      var editingItemId = null;    // item being renamed

      /* ========================================
         DOM References
      ======================================== */
      var listsView = document.getElementById('lists-view');
      var itemsView = document.getElementById('items-view');
      var listsContainer = document.getElementById('lists-container');
      var listsEmpty = document.getElementById('lists-empty');
      var itemsContainer = document.getElementById('items-container');
      var itemsEmpty = document.getElementById('items-empty');
      var itemsTitle = document.getElementById('items-title');

      /* Dialogs */
      var listDialog = document.getElementById('list-dialog');
      var listDialogTitle = document.getElementById('list-dialog-title');
      var listNameInput = document.getElementById('list-name-input');
      var listDialogSave = document.getElementById('list-dialog-save');
      var listDialogCancel = document.getElementById('list-dialog-cancel');

      var itemDialog = document.getElementById('item-dialog');
      var itemDialogTitle = document.getElementById('item-dialog-title');
      var itemTextInput = document.getElementById('item-text-input');
      var itemDialogSave = document.getElementById('item-dialog-save');
      var itemDialogCancel = document.getElementById('item-dialog-cancel');

      /* ========================================
         View Switching
      ======================================== */

      /* Show the lists overview */
      function showListsView() {
        currentListId = null;
        listsView.classList.remove('view-hidden');
        itemsView.classList.add('view-hidden');
        renderLists();
      }

      /* Show the items view for a specific list */
      function showItemsView(listId) {
        currentListId = listId;
        listsView.classList.add('view-hidden');
        itemsView.classList.remove('view-hidden');
        renderItems();
      }

      /* ========================================
         Lists View Rendering
      ======================================== */

      /* Render all lists as cards */
      function renderLists() {
        var lists = loadLists();
        listsContainer.innerHTML = '';

        if (lists.length === 0) {
          listsEmpty.hidden = false;
          return;
        }

        listsEmpty.hidden = true;

        lists.forEach(function(list) {
          var article = document.createElement('article');
          article.dataset.id = list.id;
          article.className = 'list-card flex justify-between items-center';

          var itemCount = list.items ? list.items.length : 0;
          var countLabel = itemCount === 1 ? '1 item' : itemCount + ' items';

          article.innerHTML =
            '<strong class="flex-1 min-w-0 text-ellipsis">' + escapeHtml(list.name) + '</strong>' +
            '<small class="text-lighter shrink-0">' + countLabel + '</small>' +
            '<button class="list-card-edit text-lighter" title="Edit list">&hellip;</button>';

          /* Tap card to open list */
          article.addEventListener('click', function() {
            showItemsView(list.id);
          });

          /* Edit button opens inline edit form */
          article.querySelector('.list-card-edit').addEventListener('click', function(e) {
            e.stopPropagation();
            showInlineEdit(article, list.id);
          });

          listsContainer.appendChild(article);
        });
      }

      /* Show inline rename/delete form for a list card */
      function showInlineEdit(article, listId) {
        var lists = loadLists();
        var list = lists.find(function(l) { return l.id === listId; });
        if (!list) return;

        /* Replace card content with inline edit form */
        article.className = 'form-stack';
        article.innerHTML = '';

        var input = document.createElement('input');
        input.type = 'text';
        input.value = list.name;
        input.setAttribute('aria-label', 'List name');

        var actions = document.createElement('div');
        actions.className = 'inline-actions flex gap-sm';

        var saveBtn = document.createElement('button');
        saveBtn.textContent = 'Save';

        var deleteBtn = document.createElement('button');
        deleteBtn.setAttribute('data-variant', 'danger');
        deleteBtn.textContent = 'Delete';

        var cancelBtn = document.createElement('button');
        cancelBtn.setAttribute('data-variant', 'secondary');
        cancelBtn.textContent = 'Cancel';

        actions.appendChild(saveBtn);
        actions.appendChild(deleteBtn);
        actions.appendChild(cancelBtn);
        article.appendChild(input);
        article.appendChild(actions);

        input.focus();
        input.select();

        /* Save rename */
        function saveRename() {
          var name = input.value.trim();
          if (!name) return;
          var freshLists = loadLists();
          var target = freshLists.find(function(l) { return l.id === listId; });
          if (target) {
            target.name = name;
            saveLists(freshLists);
          }
          renderLists();
        }

        saveBtn.addEventListener('click', saveRename);
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            saveRename();
          }
          if (e.key === 'Escape') {
            renderLists();
          }
        });

        /* Delete list */
        deleteBtn.addEventListener('click', function() {
          var freshLists = loadLists();
          freshLists = freshLists.filter(function(l) { return l.id !== listId; });
          saveLists(freshLists);
          renderLists();
        });

        /* Cancel */
        cancelBtn.addEventListener('click', function() {
          renderLists();
        });
      }

      /* ========================================
         Items View Rendering
      ======================================== */

      /* Render all items in the current list */
      function renderItems() {
        var lists = loadLists();
        var list = lists.find(function(l) { return l.id === currentListId; });
        if (!list) return;

        itemsTitle.textContent = list.name;
        itemsContainer.innerHTML = '';

        if (!list.items || list.items.length === 0) {
          itemsEmpty.hidden = false;
          return;
        }

        itemsEmpty.hidden = true;

        list.items.forEach(function(item, index) {
          var article = document.createElement('article');
          article.className = 'item-card flex items-center gap-sm';
          article.dataset.id = item.id;
          article.dataset.index = index;
          article.draggable = true;

          article.innerHTML =
            '<span class="drag-handle text-lighter" title="Drag to reorder">&#9776;</span>' +
            '<strong class="item-rank">#' + (index + 1) + '</strong>' +
            '<span class="item-text flex-1 min-w-0 text-ellipsis">' + escapeHtml(item.text) + '</span>' +
            '<nav class="flex items-center shrink-0">' +
              '<button class="item-action-btn text-lighter move-up" title="Move up" ' +
                (index === 0 ? 'disabled' : '') + '>&#9650;</button>' +
              '<button class="item-action-btn text-lighter move-down" title="Move down" ' +
                (index === list.items.length - 1 ? 'disabled' : '') + '>&#9660;</button>' +
              '<button class="item-action-btn delete-item" title="Remove">&times;</button>' +
            '</nav>';

          /* Tap item text to rename */
          article.querySelector('.item-text').addEventListener('click', function() {
            openRenameItemDialog(item.id, item.text);
          });

          /* Move up */
          article.querySelector('.move-up').addEventListener('click', function(e) {
            e.stopPropagation();
            moveItem(item.id, -1);
          });

          /* Move down */
          article.querySelector('.move-down').addEventListener('click', function(e) {
            e.stopPropagation();
            moveItem(item.id, 1);
          });

          /* Delete */
          article.querySelector('.delete-item').addEventListener('click', function(e) {
            e.stopPropagation();
            removeItem(item.id);
          });

          /* Desktop drag-and-drop */
          article.addEventListener('dragstart', handleDragStart);
          article.addEventListener('dragover', handleDragOver);
          article.addEventListener('dragleave', handleDragLeave);
          article.addEventListener('drop', handleDrop);
          article.addEventListener('dragend', handleDragEnd);

          itemsContainer.appendChild(article);
        });

        /* Touch drag-and-drop setup */
        setupTouchDrag();
      }

      /* ========================================
         List CRUD Operations
      ======================================== */

      /* Open dialog to create a new list */
      function openAddListDialog() {
        listDialogTitle.textContent = 'New List';
        listNameInput.value = '';
        listDialog.showModal();
        listNameInput.focus();
      }

      /* Save new list from dialog */
      function saveList() {
        var name = listNameInput.value.trim();
        if (!name) return;

        var lists = loadLists();
        lists.push({
          id: generateId(),
          name: name,
          items: []
        });

        saveLists(lists);
        listDialog.close();
        renderLists();
      }

      /* ========================================
         Item CRUD Operations
      ======================================== */

      /* Open dialog to add a new item */
      function openAddItemDialog() {
        editingItemId = null;
        itemDialogTitle.textContent = 'New Item';
        itemTextInput.value = '';
        itemDialog.showModal();
        itemTextInput.focus();
      }

      /* Open dialog to rename an item */
      function openRenameItemDialog(itemId, currentText) {
        editingItemId = itemId;
        itemDialogTitle.textContent = 'Rename Item';
        itemTextInput.value = currentText;
        itemDialog.showModal();
        itemTextInput.focus();
        itemTextInput.select();
      }

      /* Save item (create or rename) */
      function saveItem() {
        var text = itemTextInput.value.trim();
        if (!text) return;

        var lists = loadLists();
        var list = lists.find(function(l) { return l.id === currentListId; });
        if (!list) return;

        if (editingItemId) {
          /* Rename existing item */
          var item = list.items.find(function(i) { return i.id === editingItemId; });
          if (item) {
            item.text = text;
          }
        } else {
          /* Add new item at the end */
          if (!list.items) list.items = [];
          list.items.push({
            id: generateId(),
            text: text
          });
        }

        saveLists(lists);
        itemDialog.close();
        renderItems();
      }

      /* Remove an item from the current list */
      function removeItem(itemId) {
        var lists = loadLists();
        var list = lists.find(function(l) { return l.id === currentListId; });
        if (!list) return;

        list.items = list.items.filter(function(i) { return i.id !== itemId; });
        saveLists(lists);
        renderItems();
      }

      /* Move an item up or down by a given direction (-1 or +1) */
      function moveItem(itemId, direction) {
        var lists = loadLists();
        var list = lists.find(function(l) { return l.id === currentListId; });
        if (!list || !list.items) return;

        var index = list.items.findIndex(function(i) { return i.id === itemId; });
        if (index === -1) return;

        var newIndex = index + direction;
        if (newIndex < 0 || newIndex >= list.items.length) return;

        /* Swap items */
        var temp = list.items[index];
        list.items[index] = list.items[newIndex];
        list.items[newIndex] = temp;

        saveLists(lists);
        renderItems();
      }

      /* Reorder item from one index to another */
      function reorderItem(fromIndex, toIndex) {
        if (fromIndex === toIndex) return;

        var lists = loadLists();
        var list = lists.find(function(l) { return l.id === currentListId; });
        if (!list || !list.items) return;

        var item = list.items.splice(fromIndex, 1)[0];
        list.items.splice(toIndex, 0, item);

        saveLists(lists);
        renderItems();
      }

      /* ========================================
         Desktop Drag-and-Drop
      ======================================== */
      var dragSourceIndex = null;

      function handleDragStart(e) {
        dragSourceIndex = parseInt(this.dataset.index);
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', this.dataset.index);
      }

      function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        this.classList.add('drag-over');
      }

      function handleDragLeave() {
        this.classList.remove('drag-over');
      }

      function handleDrop(e) {
        e.preventDefault();
        this.classList.remove('drag-over');
        var toIndex = parseInt(this.dataset.index);
        if (dragSourceIndex !== null && dragSourceIndex !== toIndex) {
          reorderItem(dragSourceIndex, toIndex);
        }
      }

      function handleDragEnd() {
        this.classList.remove('dragging');
        dragSourceIndex = null;
        /* Clean up all drag-over states */
        itemsContainer.querySelectorAll('.drag-over').forEach(function(el) {
          el.classList.remove('drag-over');
        });
      }

      /* ========================================
         Touch Drag-and-Drop
      ======================================== */
      var touchDragItem = null;
      var touchGhost = null;
      var touchStartY = 0;
      var touchCurrentIndex = null;
      var touchTargetIndex = null;

      function setupTouchDrag() {
        var handles = itemsContainer.querySelectorAll('.drag-handle');
        handles.forEach(function(handle) {
          handle.addEventListener('touchstart', onTouchDragStart, { passive: false });
        });
      }

      function onTouchDragStart(e) {
        e.preventDefault();
        var card = this.closest('.item-card');
        if (!card) return;

        touchDragItem = card;
        touchCurrentIndex = parseInt(card.dataset.index);
        touchTargetIndex = touchCurrentIndex;
        touchStartY = e.touches[0].clientY;

        /* Create ghost element */
        touchGhost = document.createElement('div');
        touchGhost.className = 'drag-ghost';
        touchGhost.textContent = card.querySelector('.item-text').textContent;
        var rect = card.getBoundingClientRect();
        touchGhost.style.width = rect.width + 'px';
        touchGhost.style.left = rect.left + 'px';
        touchGhost.style.top = e.touches[0].clientY - 20 + 'px';
        document.body.appendChild(touchGhost);

        card.classList.add('dragging');

        document.addEventListener('touchmove', onTouchDragMove, { passive: false });
        document.addEventListener('touchend', onTouchDragEnd);
      }

      function onTouchDragMove(e) {
        e.preventDefault();
        if (!touchGhost) return;

        var touchY = e.touches[0].clientY;
        touchGhost.style.top = touchY - 20 + 'px';

        /* Determine which card we're over */
        var cards = itemsContainer.querySelectorAll('.item-card');
        cards.forEach(function(card) {
          card.classList.remove('drag-over');
        });

        touchTargetIndex = touchCurrentIndex;
        cards.forEach(function(card) {
          var rect = card.getBoundingClientRect();
          var midY = rect.top + rect.height / 2;
          if (touchY > midY) {
            touchTargetIndex = parseInt(card.dataset.index);
          }
        });

        /* Show drop indicator on target */
        if (touchTargetIndex !== touchCurrentIndex) {
          var targetCard = itemsContainer.querySelector('[data-index="' + touchTargetIndex + '"]');
          if (targetCard) {
            targetCard.classList.add('drag-over');
          }
        }
      }

      function onTouchDragEnd() {
        document.removeEventListener('touchmove', onTouchDragMove);
        document.removeEventListener('touchend', onTouchDragEnd);

        /* Clean up ghost */
        if (touchGhost) {
          touchGhost.remove();
          touchGhost = null;
        }

        /* Clean up dragging state */
        if (touchDragItem) {
          touchDragItem.classList.remove('dragging');
        }

        /* Perform reorder */
        if (touchCurrentIndex !== null && touchTargetIndex !== null &&
            touchCurrentIndex !== touchTargetIndex) {
          reorderItem(touchCurrentIndex, touchTargetIndex);
        }

        /* Reset */
        itemsContainer.querySelectorAll('.drag-over').forEach(function(el) {
          el.classList.remove('drag-over');
        });
        touchDragItem = null;
        touchCurrentIndex = null;
        touchTargetIndex = null;
      }

      /* ========================================
         Event Listeners
      ======================================== */

      function setupEventListeners() {
        /* Add list button */
        document.getElementById('add-list-btn').addEventListener('click', openAddListDialog);

        /* Back button */
        document.getElementById('back-btn').addEventListener('click', showListsView);

        /* Add item button */
        document.getElementById('add-item-btn').addEventListener('click', openAddItemDialog);

        /* List dialog */
        listDialogSave.addEventListener('click', saveList);
        listDialogCancel.addEventListener('click', function() {
          listDialog.close();
        });
        listNameInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            saveList();
          }
        });

        /* Item dialog */
        itemDialogSave.addEventListener('click', saveItem);
        itemDialogCancel.addEventListener('click', function() {
          itemDialog.close();
        });
        itemTextInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            saveItem();
          }
        });

        /* Close dialogs on backdrop click */
        listDialog.addEventListener('click', function(e) {
          if (e.target === listDialog) listDialog.close();
        });
        itemDialog.addEventListener('click', function(e) {
          if (e.target === itemDialog) itemDialog.close();
        });
      }

      /* ========================================
         Initialization
      ======================================== */

      function init() {
        setupEventListeners();
        renderLists();
      }

      document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
