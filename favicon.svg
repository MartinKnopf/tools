<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Toolbox base -->
  <rect x="5" y="15" width="22" height="12" rx="1.5" fill="url(#mainGrad)" stroke="#60a5fa" stroke-width="0.5"/>

  <!-- Toolbox lid -->
  <rect x="5" y="12" width="22" height="3.5" rx="1" fill="#2563eb" stroke="#60a5fa" stroke-width="0.5"/>

  <!-- Handle -->
  <path d="M 13 12 Q 13 7 16 7 Q 19 7 19 12" stroke="#60a5fa" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent line -->
  <rect x="5" y="20.5" width="22" height="0.5" fill="#93c5fd" opacity="0.6"/>

  <!-- Lock detail -->
