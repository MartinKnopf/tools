<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f5f3ef" />
    <title>Ant</title>
    <link rel="manifest" href="../manifest.json" />
    <link rel="apple-touch-icon" href="../icons/icon-192.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      /* Override background to lighter color */
      :root {
        --pico-background-color: #f5f3ef;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f3ef;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Ant container - full screen */
      .ant-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }

      /* The ant element */
      .ant {
        position: absolute;
        font-size: 16px;
        transform-origin: center center;
        transition: none;
        will-change: transform, left, top;
        pointer-events: auto;
      }

      /* Instructions hint */
      .hint {
        position: fixed;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.85rem;
        color: var(--pico-muted-color);
        opacity: 0.7;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="ant-container" id="antContainer">
      <div class="ant" id="ant">🕷️</div>
    </div>

    <div class="hint">Tap the ant to make it walk</div>

    <script>
      (function() {
        const ant = document.getElementById('ant');

        // Ant state
        let posX = window.innerWidth / 2;
        let posY = window.innerHeight / 2;
        let rotation = 0;
        let isWalking = false;
        let animationFrame = null;

        // Constants
        const ANT_SIZE = 16;
        const PADDING = 10;
        const ANT_SPEED = 0.16; // pixels per millisecond (constant velocity)

        // Initialize ant position
        updateAntPosition();

        /**
         * Update the ant's visual position and rotation
         */
        function updateAntPosition() {
          ant.style.left = posX + 'px';
          ant.style.top = posY + 'px';
          ant.style.transform = 'translate(-50%, -50%) rotate(' + rotation + 'deg)';
        }

        /**
         * Clamp a value between min and max
         */
        function clamp(value, min, max) {
          return Math.min(Math.max(value, min), max);
        }

        /**
         * Get screen boundaries with padding
         */
        function getBounds() {
          return {
            minX: PADDING + ANT_SIZE / 2,
            maxX: window.innerWidth - PADDING - ANT_SIZE / 2,
            minY: PADDING + ANT_SIZE / 2,
            maxY: window.innerHeight - PADDING - ANT_SIZE / 2
          };
        }

        /**
         * Calculate distance between two points
         */
        function distance(p1, p2) {
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          return Math.sqrt(dx * dx + dy * dy);
        }

        /**
         * Catmull-Rom spline interpolation
         */
        function catmullRom(p0, p1, p2, p3, t) {
          const t2 = t * t;
          const t3 = t2 * t;

          return {
            x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t +
                (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
                (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
            y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t +
                (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
                (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
          };
        }

        /**
         * Generate waypoints for natural ant movement
         */
        function generateWaypoints(targetLength) {
          const bounds = getBounds();
          const waypoints = [{ x: posX, y: posY }];

          let currentLength = 0;
          let lastX = posX;
          let lastY = posY;
          let lastAngle = (rotation - 90) * Math.PI / 180;

          // Generate waypoints until we reach target length
          while (currentLength < targetLength) {
            // Ant-like wandering: gradual turns
            const turnAmount = (Math.random() - 0.5) * Math.PI * 0.5;
            lastAngle += turnAmount;

            // Segment length
            const segLength = Math.min(50 + Math.random() * 50, targetLength - currentLength + 10);

            let newX = lastX + Math.cos(lastAngle) * segLength;
            let newY = lastY + Math.sin(lastAngle) * segLength;

            // Bounce off boundaries
            if (newX < bounds.minX) {
              newX = bounds.minX;
              lastAngle = Math.PI - lastAngle;
            } else if (newX > bounds.maxX) {
              newX = bounds.maxX;
              lastAngle = Math.PI - lastAngle;
            }
            if (newY < bounds.minY) {
              newY = bounds.minY;
              lastAngle = -lastAngle;
            } else if (newY > bounds.maxY) {
              newY = bounds.maxY;
              lastAngle = -lastAngle;
            }

            const segDist = distance({ x: lastX, y: lastY }, { x: newX, y: newY });
            if (segDist > 1) {
              waypoints.push({ x: newX, y: newY });
              currentLength += segDist;
              lastX = newX;
              lastY = newY;
            }
          }

          return waypoints;
        }

        /**
         * Build spline path with arc-length parameterization for constant velocity
         */
        function buildPath(waypoints) {
          // Need at least 2 waypoints
          if (waypoints.length < 2) {
            return { points: [], totalLength: 0 };
          }

          // Add ghost points for smooth Catmull-Rom
          const controlPoints = [];

          // Ghost point before first
          const firstDir = {
            x: waypoints[1].x - waypoints[0].x,
            y: waypoints[1].y - waypoints[0].y
          };
          controlPoints.push({
            x: waypoints[0].x - firstDir.x * 0.5,
            y: waypoints[0].y - firstDir.y * 0.5
          });

          // Add all waypoints
          for (const wp of waypoints) {
            controlPoints.push(wp);
          }

          // Ghost point after last
          const lastIdx = waypoints.length - 1;
          const lastDir = {
            x: waypoints[lastIdx].x - waypoints[lastIdx - 1].x,
            y: waypoints[lastIdx].y - waypoints[lastIdx - 1].y
          };
          controlPoints.push({
            x: waypoints[lastIdx].x + lastDir.x * 0.5,
            y: waypoints[lastIdx].y + lastDir.y * 0.5
          });

          // Sample the spline at regular intervals
          const numSegments = controlPoints.length - 3;
          const samplesPerSegment = 20;
          const points = [];
          let totalLength = 0;

          for (let seg = 0; seg < numSegments; seg++) {
            const p0 = controlPoints[seg];
            const p1 = controlPoints[seg + 1];
            const p2 = controlPoints[seg + 2];
            const p3 = controlPoints[seg + 3];

            for (let i = 0; i <= samplesPerSegment; i++) {
              // Skip first point of subsequent segments (it's the same as last point of previous)
              if (seg > 0 && i === 0) continue;

              const t = i / samplesPerSegment;
              const point = catmullRom(p0, p1, p2, p3, t);

              if (points.length > 0) {
                totalLength += distance(points[points.length - 1], point);
              }

              points.push({ ...point, dist: totalLength });
            }
          }

          return { points, totalLength };
        }

        /**
         * Get position at a given distance along the path
         */
        function getPositionAtDistance(pathPoints, targetDist) {
          if (pathPoints.length === 0) return { x: posX, y: posY };
          if (pathPoints.length === 1) return pathPoints[0];
          if (targetDist <= 0) return pathPoints[0];
          if (targetDist >= pathPoints[pathPoints.length - 1].dist) {
            return pathPoints[pathPoints.length - 1];
          }

          // Binary search for the segment
          let low = 0;
          let high = pathPoints.length - 1;

          while (low < high - 1) {
            const mid = Math.floor((low + high) / 2);
            if (pathPoints[mid].dist < targetDist) {
              low = mid;
            } else {
              high = mid;
            }
          }

          // Interpolate between points
          const p1 = pathPoints[low];
          const p2 = pathPoints[high];
          const segmentDist = p2.dist - p1.dist;

          if (segmentDist === 0) return p1;

          const t = (targetDist - p1.dist) / segmentDist;
          return {
            x: p1.x + (p2.x - p1.x) * t,
            y: p1.y + (p2.y - p1.y) * t
          };
        }

        /**
         * Start the ant walking animation
         */
        function startWalking() {
          if (isWalking) return;
          isWalking = true;

          // Random duration between 1500 and 5000 ms
          const duration = 1500 + Math.random() * 3500;

          // Calculate target path length for constant velocity
          const targetLength = duration * ANT_SPEED;

          // Generate path
          const waypoints = generateWaypoints(targetLength);
          const { points: pathPoints, totalLength } = buildPath(waypoints);

          // Calculate actual duration based on path length
          const actualDuration = totalLength > 0 ? totalLength / ANT_SPEED : duration;

          const startTime = performance.now();
          let lastPos = { x: posX, y: posY };

          function animate(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / actualDuration, 1);

            // Distance at constant velocity
            const distanceTraveled = progress * totalLength;

            // Get position
            const pos = getPositionAtDistance(pathPoints, distanceTraveled);

            // Calculate rotation from movement direction
            const dx = pos.x - lastPos.x;
            const dy = pos.y - lastPos.y;
            if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) {
              const angle = Math.atan2(dy, dx);
              rotation = (angle * 180 / Math.PI) + 90;
            }

            // Update state
            posX = pos.x;
            posY = pos.y;
            lastPos = pos;

            updateAntPosition();

            if (progress < 1) {
              animationFrame = requestAnimationFrame(animate);
            } else {
              isWalking = false;
              animationFrame = null;
            }
          }

          animationFrame = requestAnimationFrame(animate);
        }

        // Handle tap/click on ant
        ant.addEventListener('click', function(e) {
          e.stopPropagation();
          startWalking();
        });

        ant.addEventListener('touchstart', function(e) {
          e.preventDefault();
          e.stopPropagation();
          startWalking();
        }, { passive: false });

        // Handle window resize
        window.addEventListener('resize', function() {
          const bounds = getBounds();
          posX = clamp(posX, bounds.minX, bounds.maxX);
          posY = clamp(posY, bounds.minY, bounds.maxY);
          updateAntPosition();
        });
      })();
    </script>
  </body>
</html>
