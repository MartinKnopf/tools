<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f5f3ef" />
    <title>Ant</title>
    <link rel="manifest" href="../manifest.json" />
    <link rel="apple-touch-icon" href="../icons/icon-192.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      /* Override background to lighter color */
      :root {
        --pico-background-color: #f5f3ef;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f3ef;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Ant container - full screen */
      .ant-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }

      /* The ant element */
      .ant {
        position: absolute;
        font-size: 32px;
        transform-origin: center center;
        transition: none;
        will-change: transform, left, top;
        pointer-events: auto;
      }

      /* Back button */
      .back-link {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 100;
        font-size: 0.9rem;
        opacity: 0.6;
        text-decoration: none;
        color: var(--pico-color);
      }

      .back-link:hover {
        opacity: 1;
      }

      /* Instructions hint */
      .hint {
        position: fixed;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.85rem;
        color: var(--pico-muted-color);
        opacity: 0.7;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <a href="../index.html" class="back-link">&larr; Back</a>

    <div class="ant-container" id="antContainer">
      <div class="ant" id="ant">🐜</div>
    </div>

    <div class="hint">Tap the ant to make it walk</div>

    <script>
      (function() {
        const ant = document.getElementById('ant');
        const container = document.getElementById('antContainer');

        // Ant state
        let posX = window.innerWidth / 2;
        let posY = window.innerHeight / 2;
        let rotation = 0;
        let isWalking = false;
        let animationFrame = null;

        // Ant size for boundary calculations
        const ANT_SIZE = 32;
        const PADDING = 10;

        // Initialize ant position
        updateAntPosition();

        /**
         * Update the ant's visual position and rotation
         */
        function updateAntPosition() {
          ant.style.left = posX + 'px';
          ant.style.top = posY + 'px';
          ant.style.transform = 'translate(-50%, -50%) rotate(' + rotation + 'deg)';
        }

        /**
         * Clamp a value between min and max
         */
        function clamp(value, min, max) {
          return Math.min(Math.max(value, min), max);
        }

        /**
         * Get screen boundaries with padding
         */
        function getBounds() {
          return {
            minX: PADDING + ANT_SIZE / 2,
            maxX: window.innerWidth - PADDING - ANT_SIZE / 2,
            minY: PADDING + ANT_SIZE / 2,
            maxY: window.innerHeight - PADDING - ANT_SIZE / 2
          };
        }

        /**
         * Generate a random point within screen bounds
         */
        function randomPointInBounds() {
          const bounds = getBounds();
          return {
            x: bounds.minX + Math.random() * (bounds.maxX - bounds.minX),
            y: bounds.minY + Math.random() * (bounds.maxY - bounds.minY)
          };
        }

        /**
         * Catmull-Rom spline interpolation for smooth curves
         * Returns a point on the spline at parameter t (0-1)
         */
        function catmullRom(p0, p1, p2, p3, t) {
          const t2 = t * t;
          const t3 = t2 * t;

          // Catmull-Rom coefficients
          const x = 0.5 * (
            (2 * p1.x) +
            (-p0.x + p2.x) * t +
            (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
            (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
          );

          const y = 0.5 * (
            (2 * p1.y) +
            (-p0.y + p2.y) * t +
            (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
            (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
          );

          return { x, y };
        }

        /**
         * Generate control points for a natural-looking ant path
         */
        function generatePath() {
          const bounds = getBounds();
          const points = [];

          // Start with current position extended backwards for smooth start
          const startAngle = (rotation - 180) * Math.PI / 180;
          points.push({
            x: posX + Math.cos(startAngle) * 50,
            y: posY + Math.sin(startAngle) * 50
          });

          // Current position
          points.push({ x: posX, y: posY });

          // Generate 2-4 intermediate waypoints for ant-like wandering
          const numWaypoints = 2 + Math.floor(Math.random() * 3);
          let lastX = posX;
          let lastY = posY;

          for (let i = 0; i < numWaypoints; i++) {
            // Ants tend to move in somewhat directed but curved paths
            // Random direction with some forward bias
            const baseAngle = Math.atan2(
              bounds.maxY / 2 - lastY,
              bounds.maxX / 2 - lastX
            );
            const angle = baseAngle + (Math.random() - 0.5) * Math.PI * 1.5;

            // Random distance (ants take short bursts)
            const distance = 40 + Math.random() * 80;

            let newX = lastX + Math.cos(angle) * distance;
            let newY = lastY + Math.sin(angle) * distance;

            // Clamp to bounds
            newX = clamp(newX, bounds.minX, bounds.maxX);
            newY = clamp(newY, bounds.minY, bounds.maxY);

            points.push({ x: newX, y: newY });
            lastX = newX;
            lastY = newY;
          }

          // Add final extended point for smooth ending
          const lastIdx = points.length - 1;
          const prevIdx = points.length - 2;
          const endAngle = Math.atan2(
            points[lastIdx].y - points[prevIdx].y,
            points[lastIdx].x - points[prevIdx].x
          );
          points.push({
            x: clamp(points[lastIdx].x + Math.cos(endAngle) * 50, bounds.minX, bounds.maxX),
            y: clamp(points[lastIdx].y + Math.sin(endAngle) * 50, bounds.minY, bounds.maxY)
          });

          return points;
        }

        /**
         * Animate the ant along a spline path
         */
        function startWalking() {
          if (isWalking) return;
          isWalking = true;

          // Random duration between 500 and 2000 ms
          const duration = 500 + Math.random() * 1500;
          const path = generatePath();
          const startTime = performance.now();

          // Calculate total segments (excluding first and last control points)
          const numSegments = path.length - 3;

          function animate(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);

            // Ease in-out for natural movement
            const eased = progress < 0.5
              ? 2 * progress * progress
              : 1 - Math.pow(-2 * progress + 2, 2) / 2;

            // Find which segment we're in
            const totalProgress = eased * numSegments;
            const segmentIndex = Math.min(Math.floor(totalProgress), numSegments - 1);
            const segmentProgress = totalProgress - segmentIndex;

            // Get the four control points for this segment
            const p0 = path[segmentIndex];
            const p1 = path[segmentIndex + 1];
            const p2 = path[segmentIndex + 2];
            const p3 = path[segmentIndex + 3];

            // Interpolate position
            const pos = catmullRom(p0, p1, p2, p3, segmentProgress);

            // Calculate rotation based on movement direction
            const nextT = Math.min(segmentProgress + 0.01, 1);
            const nextPos = catmullRom(p0, p1, p2, p3, nextT);
            const angle = Math.atan2(nextPos.y - pos.y, nextPos.x - pos.x);

            // Update position
            posX = pos.x;
            posY = pos.y;
            rotation = (angle * 180 / Math.PI) + 90; // +90 because ant emoji faces up

            updateAntPosition();

            if (progress < 1) {
              animationFrame = requestAnimationFrame(animate);
            } else {
              isWalking = false;
              animationFrame = null;
            }
          }

          animationFrame = requestAnimationFrame(animate);
        }

        // Handle tap/click on ant
        ant.addEventListener('click', function(e) {
          e.stopPropagation();
          startWalking();
        });

        ant.addEventListener('touchstart', function(e) {
          e.preventDefault();
          e.stopPropagation();
          startWalking();
        }, { passive: false });

        // Handle window resize - keep ant in bounds
        window.addEventListener('resize', function() {
          const bounds = getBounds();
          posX = clamp(posX, bounds.minX, bounds.maxX);
          posY = clamp(posY, bounds.minY, bounds.maxY);
          updateAntPosition();
        });
      })();
    </script>
  </body>
</html>
