<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f5f3ef" />
    <title>Ant</title>
    <link rel="manifest" href="../manifest.json" />
    <link rel="apple-touch-icon" href="../icons/icon-192.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      /* Override background to lighter color */
      :root {
        --pico-background-color: #f5f3ef;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f3ef;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Ant container - full screen */
      .ant-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }

      /* The ant element */
      .ant {
        position: absolute;
        font-size: 32px;
        transform-origin: center center;
        transition: none;
        will-change: transform, left, top;
        pointer-events: auto;
      }

      /* Back button */
      .back-link {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 100;
        font-size: 0.9rem;
        opacity: 0.6;
        text-decoration: none;
        color: var(--pico-color);
      }

      .back-link:hover {
        opacity: 1;
      }

      /* Instructions hint */
      .hint {
        position: fixed;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.85rem;
        color: var(--pico-muted-color);
        opacity: 0.7;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <a href="../index.html" class="back-link">&larr; Back</a>

    <div class="ant-container" id="antContainer">
      <div class="ant" id="ant">🐜</div>
    </div>

    <div class="hint">Tap the ant to make it walk</div>

    <script>
      (function() {
        const ant = document.getElementById('ant');

        // Ant state
        let posX = window.innerWidth / 2;
        let posY = window.innerHeight / 2;
        let rotation = 0;
        let isWalking = false;
        let animationFrame = null;

        // Constants
        const ANT_SIZE = 32;
        const PADDING = 10;
        const ANT_SPEED = 0.08; // pixels per millisecond (constant velocity)

        // Initialize ant position
        updateAntPosition();

        /**
         * Update the ant's visual position and rotation
         */
        function updateAntPosition() {
          ant.style.left = posX + 'px';
          ant.style.top = posY + 'px';
          ant.style.transform = 'translate(-50%, -50%) rotate(' + rotation + 'deg)';
        }

        /**
         * Clamp a value between min and max
         */
        function clamp(value, min, max) {
          return Math.min(Math.max(value, min), max);
        }

        /**
         * Get screen boundaries with padding
         */
        function getBounds() {
          return {
            minX: PADDING + ANT_SIZE / 2,
            maxX: window.innerWidth - PADDING - ANT_SIZE / 2,
            minY: PADDING + ANT_SIZE / 2,
            maxY: window.innerHeight - PADDING - ANT_SIZE / 2
          };
        }

        /**
         * Catmull-Rom spline interpolation
         */
        function catmullRom(p0, p1, p2, p3, t) {
          const t2 = t * t;
          const t3 = t2 * t;

          const x = 0.5 * (
            (2 * p1.x) +
            (-p0.x + p2.x) * t +
            (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
            (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
          );

          const y = 0.5 * (
            (2 * p1.y) +
            (-p0.y + p2.y) * t +
            (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
            (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
          );

          return { x, y };
        }

        /**
         * Calculate distance between two points
         */
        function distance(p1, p2) {
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          return Math.sqrt(dx * dx + dy * dy);
        }

        /**
         * Build a lookup table for arc-length parameterization
         * This allows constant velocity movement along the spline
         */
        function buildArcLengthTable(controlPoints, samplesPerSegment) {
          const table = [{ t: 0, dist: 0 }];
          let totalDist = 0;
          const numSegments = controlPoints.length - 3;

          for (let seg = 0; seg < numSegments; seg++) {
            const p0 = controlPoints[seg];
            const p1 = controlPoints[seg + 1];
            const p2 = controlPoints[seg + 2];
            const p3 = controlPoints[seg + 3];

            let prevPoint = catmullRom(p0, p1, p2, p3, 0);

            for (let i = 1; i <= samplesPerSegment; i++) {
              const localT = i / samplesPerSegment;
              const point = catmullRom(p0, p1, p2, p3, localT);
              totalDist += distance(prevPoint, point);

              // Global t value across all segments
              const globalT = (seg + localT) / numSegments;
              table.push({ t: globalT, dist: totalDist });

              prevPoint = point;
            }
          }

          return { table, totalLength: totalDist };
        }

        /**
         * Find t value for a given distance using the arc-length table
         */
        function getTForDistance(table, targetDist) {
          // Binary search for the closest entry
          let low = 0;
          let high = table.length - 1;

          while (low < high - 1) {
            const mid = Math.floor((low + high) / 2);
            if (table[mid].dist < targetDist) {
              low = mid;
            } else {
              high = mid;
            }
          }

          // Linear interpolation between entries
          const d0 = table[low].dist;
          const d1 = table[high].dist;
          const t0 = table[low].t;
          const t1 = table[high].t;

          if (d1 === d0) return t0;

          const ratio = (targetDist - d0) / (d1 - d0);
          return t0 + ratio * (t1 - t0);
        }

        /**
         * Get position on spline at global t (0-1)
         */
        function getPositionAtT(controlPoints, t) {
          const numSegments = controlPoints.length - 3;
          const scaledT = t * numSegments;
          const segIndex = Math.min(Math.floor(scaledT), numSegments - 1);
          const localT = scaledT - segIndex;

          return catmullRom(
            controlPoints[segIndex],
            controlPoints[segIndex + 1],
            controlPoints[segIndex + 2],
            controlPoints[segIndex + 3],
            localT
          );
        }

        /**
         * Generate control points for a path with target length
         */
        function generatePath(targetLength) {
          const bounds = getBounds();
          const points = [];

          // Ghost point before start for smooth curve beginning
          const startAngle = (rotation - 90) * Math.PI / 180;
          points.push({
            x: posX - Math.cos(startAngle) * 30,
            y: posY - Math.sin(startAngle) * 30
          });

          // Start at current position
          points.push({ x: posX, y: posY });

          // Generate waypoints to achieve target path length
          let currentLength = 0;
          let lastX = posX;
          let lastY = posY;
          let lastAngle = startAngle;

          while (currentLength < targetLength * 0.8) {
            // Ant-like wandering: mostly forward with slight turns
            const turnAmount = (Math.random() - 0.5) * Math.PI * 0.6;
            lastAngle += turnAmount;

            // Segment length varies slightly
            const segLength = 40 + Math.random() * 60;

            let newX = lastX + Math.cos(lastAngle) * segLength;
            let newY = lastY + Math.sin(lastAngle) * segLength;

            // Bounce off boundaries with angle reflection
            if (newX < bounds.minX || newX > bounds.maxX) {
              lastAngle = Math.PI - lastAngle;
              newX = clamp(newX, bounds.minX, bounds.maxX);
            }
            if (newY < bounds.minY || newY > bounds.maxY) {
              lastAngle = -lastAngle;
              newY = clamp(newY, bounds.minY, bounds.maxY);
            }

            points.push({ x: newX, y: newY });
            currentLength += distance({ x: lastX, y: lastY }, { x: newX, y: newY });
            lastX = newX;
            lastY = newY;
          }

          // Ghost point after end for smooth curve ending
          const endAngle = lastAngle;
          points.push({
            x: clamp(lastX + Math.cos(endAngle) * 30, bounds.minX, bounds.maxX),
            y: clamp(lastY + Math.sin(endAngle) * 30, bounds.minY, bounds.maxY)
          });

          return points;
        }

        /**
         * Start the ant walking animation
         */
        function startWalking() {
          if (isWalking) return;
          isWalking = true;

          // Random duration between 1500 and 5000 ms
          const duration = 1500 + Math.random() * 3500;

          // Calculate path length based on duration and constant speed
          const targetLength = duration * ANT_SPEED;

          // Generate path and build arc-length table
          const controlPoints = generatePath(targetLength);
          const { table, totalLength } = buildArcLengthTable(controlPoints, 20);

          // Actual duration based on real path length for constant velocity
          const actualDuration = totalLength / ANT_SPEED;

          const startTime = performance.now();

          function animate(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / actualDuration, 1);

            // Distance traveled at constant velocity
            const distanceTraveled = progress * totalLength;

            // Get t value for this distance (arc-length parameterization)
            const t = getTForDistance(table, distanceTraveled);

            // Get current position
            const pos = getPositionAtT(controlPoints, t);

            // Calculate rotation from movement direction
            const nextT = Math.min(t + 0.001, 1);
            const nextPos = getPositionAtT(controlPoints, nextT);
            const angle = Math.atan2(nextPos.y - pos.y, nextPos.x - pos.x);

            // Update ant state
            posX = pos.x;
            posY = pos.y;
            rotation = (angle * 180 / Math.PI) + 90; // +90 because ant emoji faces up

            updateAntPosition();

            if (progress < 1) {
              animationFrame = requestAnimationFrame(animate);
            } else {
              isWalking = false;
              animationFrame = null;
            }
          }

          animationFrame = requestAnimationFrame(animate);
        }

        // Handle tap/click on ant
        ant.addEventListener('click', function(e) {
          e.stopPropagation();
          startWalking();
        });

        ant.addEventListener('touchstart', function(e) {
          e.preventDefault();
          e.stopPropagation();
          startWalking();
        }, { passive: false });

        // Handle window resize - keep ant in bounds
        window.addEventListener('resize', function() {
          const bounds = getBounds();
          posX = clamp(posX, bounds.minX, bounds.maxX);
          posY = clamp(posY, bounds.minY, bounds.maxY);
          updateAntPosition();
        });
      })();
    </script>
  </body>
</html>
