<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#574747" />
    <title>Cut</title>
    <link rel="manifest" href="../manifest.json" />
    <link rel="apple-touch-icon" href="../icons/icon-192.png" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@knadh/oat/oat.min.css"
    />
    <script src="https://unpkg.com/@knadh/oat/oat.min.js" defer></script>
    <link rel="stylesheet" href="../style.css" />
    <style>
      /* Video element fills container width */
      #video {
        width: 100%;
        display: block;
      }

      /* Timeline visualization */
      .timeline-wrap {
        position: relative;
        height: 48px;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      .timeline-bar {
        position: absolute;
        top: 8px;
        left: 0;
        right: 0;
        height: 32px;
        display: flex;
        border-radius: 4px;
        overflow: hidden;
      }

      /* Segment blocks inside the timeline bar */
      .timeline-segment {
        height: 100%;
        position: relative;
        transition: opacity 0.1s;
      }

      .timeline-segment:hover {
        opacity: 0.8;
      }

      .timeline-segment[data-mode="normal"] {
        background: var(--muted);
      }

      .timeline-segment[data-mode="remove"] {
        background: var(--danger);
        opacity: 0.5;
      }

      .timeline-segment[data-mode="slow"] {
        background: var(--info);
      }

      .timeline-segment[data-mode="fast"] {
        background: var(--warning);
      }

      /* Marker lines on the timeline */
      .timeline-marker {
        position: absolute;
        top: 4px;
        width: 3px;
        height: 40px;
        background: var(--foreground);
        transform: translateX(-1px);
        z-index: 2;
        cursor: grab;
      }

      .timeline-marker:active {
        cursor: grabbing;
      }

      .timeline-marker.edge {
        cursor: default;
        opacity: 0.3;
      }

      /* Playhead on the timeline */
      .timeline-playhead {
        position: absolute;
        top: 0;
        width: 2px;
        height: 48px;
        background: var(--primary);
        z-index: 3;
        pointer-events: none;
        transform: translateX(-1px);
      }

      /* Frame controls row */
      .frame-controls {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        flex-wrap: wrap;
      }

      .frame-controls button {
        width: auto;
      }

      .time-display {
        font-family: monospace;
        font-size: 0.9rem;
        color: var(--muted-foreground);
        min-width: 120px;
      }

      /* Segment list */
      .segment-item {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        flex-wrap: wrap;
      }

      .segment-item select {
        width: auto;
        margin: 0;
      }

      .segment-color {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      .segment-time {
        font-family: monospace;
        font-size: 0.85rem;
        flex: 1;
        min-width: 0;
      }

      /* Preview controls */
      .preview-controls {
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
      }

      .preview-controls button {
        width: auto;
      }
    </style>
  </head>
  <body data-theme="dark">
    <main class="container">
      <!-- Header -->
      <div class="header-row mb-2">
        <h1>Cut</h1>
        <label class="button" for="file-input" style="cursor: pointer; margin: 0">
          Load Video
          <input type="file" id="file-input" accept="video/*" hidden />
        </label>
      </div>

      <!-- Empty state -->
      <p class="empty-state" id="empty-state">
        Load a video to start cutting.
      </p>

      <!-- Video and controls (hidden until video loaded) -->
      <div id="editor" class="hidden">
        <!-- Video player -->
        <section>
          <video id="video" playsinline></video>
        </section>

        <!-- Timeline -->
        <section>
          <div class="timeline-wrap" id="timeline">
            <div class="timeline-bar" id="timeline-bar"></div>
            <div class="timeline-playhead" id="playhead"></div>
          </div>
        </section>

        <!-- Frame navigation and marker controls -->
        <section>
          <div class="frame-controls">
            <span class="time-display" id="time-display">0:00.000 / 0:00</span>
            <button id="prev-frame-btn" title="Previous frame">&larr; Frame</button>
            <button id="next-frame-btn" title="Next frame">Frame &rarr;</button>
            <button id="add-marker-btn">Add Marker</button>
            <button id="remove-marker-btn" data-variant="danger">Remove Nearest Marker</button>
          </div>
        </section>

        <!-- Segments list -->
        <section>
          <h3>Segments</h3>
          <div class="flex flex-col gap-sm" id="segment-list"></div>
        </section>

        <!-- Preview and download controls -->
        <section>
          <div class="preview-controls">
            <button id="preview-btn">Preview</button>
            <button id="stop-preview-btn" data-variant="secondary" class="hidden">Stop</button>
            <button id="download-btn">Download</button>
            <span id="download-status" class="time-display hidden"></span>
          </div>
        </section>

        <!-- Debug log -->
        <section>
          <details open>
            <summary>Log</summary>
            <pre id="debug-log" style="max-height: 200px; overflow-y: auto; font-size: 0.8rem;"></pre>
          </details>
        </section>
      </div>
    </main>

    <script>
      /* ========================================
         Debug Logger
      ======================================== */
      const debugLogEl = document.getElementById("debug-log");
      function log(msg) {
        var line = new Date().toISOString().slice(11, 23) + " " + msg;
        debugLogEl.textContent += line + "\n";
        debugLogEl.scrollTop = debugLogEl.scrollHeight;
      }

      /* ========================================
         State
      ======================================== */
      const FRAME_STEP = 1 / 30; // assume 30fps for frame stepping

      let videoUrl = null;    // object URL for the loaded video
      let videoFile = null;   // original File object (needed for FFmpeg)
      let duration = 0;       // video duration in seconds
      let markers = [];       // sorted array of marker times (excludes 0 and duration)
      let segments = [];      // derived: [{start, end, mode}]
      let previewing = false; // preview playback active
      let previewRafId = null;
      let recording = false; // recording for download
      let mediaRecorder = null;
      let recordedChunks = [];

      /* ========================================
         DOM References
      ======================================== */
      const fileInput = document.getElementById("file-input");
      const emptyState = document.getElementById("empty-state");
      const editorEl = document.getElementById("editor");
      const video = document.getElementById("video");
      const timelineEl = document.getElementById("timeline");
      const timelineBar = document.getElementById("timeline-bar");
      const playheadEl = document.getElementById("playhead");
      const timeDisplay = document.getElementById("time-display");
      const segmentListEl = document.getElementById("segment-list");
      const prevFrameBtn = document.getElementById("prev-frame-btn");
      const nextFrameBtn = document.getElementById("next-frame-btn");
      const addMarkerBtn = document.getElementById("add-marker-btn");
      const removeMarkerBtn = document.getElementById("remove-marker-btn");
      const previewBtn = document.getElementById("preview-btn");
      const stopPreviewBtn = document.getElementById("stop-preview-btn");
      const downloadBtn = document.getElementById("download-btn");
      const downloadStatus = document.getElementById("download-status");

      /* ========================================
         Utilities
      ======================================== */

      // Format seconds as M:SS.mmm
      function formatTime(s) {
        if (!isFinite(s) || s < 0) s = 0;
        var mins = Math.floor(s / 60);
        var secs = s % 60;
        return mins + ":" + secs.toFixed(3).padStart(6, "0");
      }

      // Format seconds as M:SS (no millis)
      function formatTimeShort(s) {
        if (!isFinite(s) || s < 0) s = 0;
        var mins = Math.floor(s / 60);
        var secs = Math.floor(s % 60);
        return mins + ":" + String(secs).padStart(2, "0");
      }

      // Rebuild segments array from markers
      function rebuildSegments() {
        var points = [0].concat(markers).concat([duration]);
        segments = [];
        for (var i = 0; i < points.length - 1; i++) {
          // Preserve existing mode if the segment boundaries match
          var existing = findExistingSegment(points[i], points[i + 1]);
          segments.push({
            start: points[i],
            end: points[i + 1],
            mode: existing ? existing.mode : "normal",
          });
        }
      }

      // Find a previously existing segment that covers the same range
      var prevSegments = [];
      function findExistingSegment(start, end) {
        for (var i = 0; i < prevSegments.length; i++) {
          if (
            Math.abs(prevSegments[i].start - start) < 0.001 &&
            Math.abs(prevSegments[i].end - end) < 0.001
          ) {
            return prevSegments[i];
          }
        }
        // If no exact match, find a segment that contained this range
        for (var i = 0; i < prevSegments.length; i++) {
          if (prevSegments[i].start <= start + 0.001 && prevSegments[i].end >= end - 0.001) {
            return prevSegments[i];
          }
        }
        return null;
      }

      // Save previous segments and rebuild
      function updateSegments() {
        prevSegments = segments.slice();
        rebuildSegments();
      }

      /* ========================================
         Video Loading
      ======================================== */

      fileInput.addEventListener("change", function (e) {
        var file = e.target.files[0];
        if (!file) return;

        // Clean up previous object URL
        if (videoUrl) URL.revokeObjectURL(videoUrl);

        // Reset state
        markers = [];
        segments = [];
        prevSegments = [];
        stopPreview();

        videoFile = file;
        videoUrl = URL.createObjectURL(file);
        video.src = videoUrl;

        video.addEventListener(
          "loadedmetadata",
          function () {
            duration = video.duration;
            video.currentTime = 0;
            updateSegments();
            render();
            emptyState.classList.add("hidden");
            editorEl.classList.remove("hidden");
          },
          { once: true }
        );
      });

      /* ========================================
         Time Display and Playhead Updates
      ======================================== */

      // Update time display and playhead position
      function updatePlayhead() {
        if (!duration) return;
        var t = video.currentTime;
        var pct = (t / duration) * 100;
        playheadEl.style.left = pct + "%";
        timeDisplay.textContent =
          formatTime(t) + " / " + formatTimeShort(duration);
      }

      video.addEventListener("timeupdate", function () {
        if (!previewing) updatePlayhead();
      });

      video.addEventListener("seeked", updatePlayhead);

      /* ========================================
         Timeline Interaction (seek by click/drag)
      ======================================== */

      // Seek video to a position based on pointer X on the timeline
      function seekToPointer(clientX) {
        var rect = timelineEl.getBoundingClientRect();
        var pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        video.currentTime = pct * duration;
        updatePlayhead();
      }

      var isSeeking = false;

      timelineEl.addEventListener("pointerdown", function (e) {
        // Ignore if clicking a marker (markers handle their own drag)
        if (e.target.classList.contains("timeline-marker")) return;
        isSeeking = true;
        seekToPointer(e.clientX);
        timelineEl.setPointerCapture(e.pointerId);
      });

      timelineEl.addEventListener("pointermove", function (e) {
        if (isSeeking) seekToPointer(e.clientX);
      });

      timelineEl.addEventListener("pointerup", function () {
        isSeeking = false;
      });

      /* ========================================
         Marker Dragging
      ======================================== */

      function setupMarkerDrag(markerEl, markerIndex) {
        var dragging = false;

        markerEl.addEventListener("pointerdown", function (e) {
          e.stopPropagation();
          dragging = true;
          markerEl.setPointerCapture(e.pointerId);
        });

        markerEl.addEventListener("pointermove", function (e) {
          if (!dragging) return;
          var rect = timelineEl.getBoundingClientRect();
          var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          var newTime = pct * duration;

          // Clamp to neighboring markers (or 0/duration)
          var points = [0].concat(markers).concat([duration]);
          // markerIndex refers to index in markers array, in points it's markerIndex+1
          var pointIdx = markerIndex + 1;
          var minTime = points[pointIdx - 1] + FRAME_STEP;
          var maxTime = points[pointIdx + 1] - FRAME_STEP;
          newTime = Math.max(minTime, Math.min(maxTime, newTime));

          markers[markerIndex] = newTime;
          updateSegments();
          render();

          // Also seek video to the marker position
          video.currentTime = newTime;
          updatePlayhead();
        });

        markerEl.addEventListener("pointerup", function () {
          dragging = false;
        });
      }

      /* ========================================
         Frame Navigation
      ======================================== */

      prevFrameBtn.addEventListener("click", function () {
        video.currentTime = Math.max(0, video.currentTime - FRAME_STEP);
      });

      nextFrameBtn.addEventListener("click", function () {
        video.currentTime = Math.min(duration, video.currentTime + FRAME_STEP);
      });

      /* ========================================
         Marker Add/Remove
      ======================================== */

      addMarkerBtn.addEventListener("click", function () {
        var t = video.currentTime;

        // Don't add markers at start or end
        if (t < FRAME_STEP || t > duration - FRAME_STEP) return;

        // Don't add duplicate markers (within half a frame)
        for (var i = 0; i < markers.length; i++) {
          if (Math.abs(markers[i] - t) < FRAME_STEP / 2) return;
        }

        markers.push(t);
        markers.sort(function (a, b) { return a - b; });
        updateSegments();
        render();
      });

      removeMarkerBtn.addEventListener("click", function () {
        if (markers.length === 0) return;
        var t = video.currentTime;

        // Find nearest marker
        var nearest = 0;
        var minDist = Math.abs(markers[0] - t);
        for (var i = 1; i < markers.length; i++) {
          var dist = Math.abs(markers[i] - t);
          if (dist < minDist) {
            minDist = dist;
            nearest = i;
          }
        }

        markers.splice(nearest, 1);
        updateSegments();
        render();
      });

      /* ========================================
         Preview Playback
      ======================================== */

      previewBtn.addEventListener("click", startPreview);
      stopPreviewBtn.addEventListener("click", stopPreview);

      function startPreview() {
        if (segments.length === 0) return;
        previewing = true;
        previewBtn.classList.add("hidden");
        stopPreviewBtn.classList.remove("hidden");

        // Find the first non-removed segment
        var startIdx = 0;
        while (startIdx < segments.length && segments[startIdx].mode === "remove") {
          startIdx++;
        }
        if (startIdx >= segments.length) {
          stopPreview();
          return;
        }

        playSegment(startIdx);
      }

      function playSegment(idx) {
        if (!previewing || idx >= segments.length) {
          stopPreview();
          return;
        }

        var seg = segments[idx];

        // Skip removed segments
        if (seg.mode === "remove") {
          playSegment(idx + 1);
          return;
        }

        // Set playback rate
        var rate = 1;
        if (seg.mode === "slow") rate = 0.5;
        if (seg.mode === "fast") rate = 2;
        video.playbackRate = rate;

        // Seek to segment start and play
        video.currentTime = seg.start;
        video.play();

        // Monitor playback to stop at segment end
        function checkEnd() {
          if (!previewing) return;
          updatePlayhead();
          if (video.currentTime >= seg.end - 0.01) {
            video.pause();
            playSegment(idx + 1);
            return;
          }
          previewRafId = requestAnimationFrame(checkEnd);
        }

        previewRafId = requestAnimationFrame(checkEnd);
      }

      function stopPreview() {
        previewing = false;
        video.pause();
        video.playbackRate = 1;
        if (previewRafId) {
          cancelAnimationFrame(previewRafId);
          previewRafId = null;
        }
        previewBtn.classList.remove("hidden");
        stopPreviewBtn.classList.add("hidden");
      }

      /* ========================================
         Download — FFmpeg.wasm (primary) with
         MediaRecorder canvas fallback
      ======================================== */

      downloadBtn.addEventListener("click", startDownload);

      var ffmpegInstance = null;
      var ffmpegLoaded = false;

      // Load FFmpeg.wasm on first use
      async function loadFFmpeg() {
        if (ffmpegLoaded) return true;

        // FFmpeg.wasm requires SharedArrayBuffer (Cross-Origin-Isolation)
        if (typeof SharedArrayBuffer === "undefined") {
          log("SharedArrayBuffer unavailable — skipping FFmpeg");
          return false;
        }

        log("loading FFmpeg.wasm…");
        downloadStatus.textContent = "Loading FFmpeg…";
        downloadStatus.classList.remove("hidden");

        try {
          // Race the load against a 15s timeout
          var timeout = new Promise(function (_, reject) {
            setTimeout(function () { reject(new Error("timeout")); }, 15000);
          });

          var load = (async function () {
            var FFmpegMod = await import("https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm");
            var UtilMod = await import("https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm");

            ffmpegInstance = new FFmpegMod.FFmpeg();
            window._ffmpegFetchFile = UtilMod.fetchFile;

            ffmpegInstance.on("log", function (e) { log("ffmpeg: " + e.message); });
            ffmpegInstance.on("progress", function (e) {
              var pct = Math.round((e.progress || 0) * 100);
              downloadStatus.textContent = "Processing… " + pct + "%";
            });

            await ffmpegInstance.load({
              coreURL: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.js",
              wasmURL: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.wasm",
            });
          })();

          await Promise.race([load, timeout]);

          ffmpegLoaded = true;
          log("FFmpeg loaded");
          return true;
        } catch (err) {
          log("FFmpeg load failed: " + err.message);
          ffmpegInstance = null;
          return false;
        }
      }

      // Main download entry point — tries FFmpeg, falls back to MediaRecorder
      async function startDownload() {
        if (segments.length === 0 || recording) return;
        log("startDownload called");

        recording = true;
        downloadBtn.disabled = true;

        var ok = await loadFFmpeg();
        if (ok) {
          await downloadWithFFmpeg();
        } else {
          log("falling back to MediaRecorder");
          downloadWithMediaRecorder();
        }
      }

      /* ---------- FFmpeg path ---------- */

      async function downloadWithFFmpeg() {
        var ff = ffmpegInstance;
        var fetchFile = window._ffmpegFetchFile;

        try {
          // Determine input extension from file name
          var inputName = videoFile.name || "input.mp4";
          var inputExt = inputName.split(".").pop() || "mp4";
          var inFile = "input." + inputExt;

          downloadStatus.textContent = "Reading file…";
          downloadStatus.classList.remove("hidden");
          log("writing input file: " + inFile + " (" + videoFile.size + " bytes)");
          await ff.writeFile(inFile, await fetchFile(videoFile));

          // Build one clip per kept segment
          var kept = segments.filter(function (s) { return s.mode !== "remove"; });
          if (kept.length === 0) {
            log("nothing to export — all segments removed");
            recording = false;
            downloadBtn.disabled = false;
            downloadStatus.classList.add("hidden");
            return;
          }

          var partFiles = [];
          for (var i = 0; i < kept.length; i++) {
            var seg = kept[i];
            var partName = "part" + i + ".mp4";
            partFiles.push(partName);

            downloadStatus.textContent = "Segment " + (i + 1) + "/" + kept.length + "…";
            log("processing segment " + i + ": " + seg.mode + " " + seg.start.toFixed(2) + "→" + seg.end.toFixed(2));

            var args = ["-ss", String(seg.start), "-to", String(seg.end), "-i", inFile];

            if (seg.mode === "normal") {
              // Stream-copy for normal segments (fast)
              args.push("-c", "copy");
            } else {
              // Re-encode for speed changes
              var pts = seg.mode === "slow" ? "2.0" : "0.5";
              var atempo = seg.mode === "slow" ? "0.5" : "2.0";
              args.push("-filter:v", "setpts=" + pts + "*PTS");
              args.push("-filter:a", "atempo=" + atempo);
            }

            args.push("-y", partName);
            log("ffmpeg " + args.join(" "));
            await ff.exec(args);
          }

          // Concatenate parts
          var outputName = "output.mp4";
          if (partFiles.length === 1) {
            outputName = partFiles[0];
          } else {
            // Build concat list
            var concatList = partFiles.map(function (f) { return "file '" + f + "'"; }).join("\n");
            await ff.writeFile("list.txt", new TextEncoder().encode(concatList));
            log("concat list:\n" + concatList);

            downloadStatus.textContent = "Joining…";
            await ff.exec(["-f", "concat", "-safe", "0", "-i", "list.txt", "-c", "copy", "-y", outputName]);
          }

          // Read output and trigger download
          downloadStatus.textContent = "Saving…";
          var data = await ff.readFile(outputName);
          log("output size: " + data.length + " bytes");
          var blob = new Blob([data.buffer], { type: "video/mp4" });
          triggerBlobDownload(blob, "cut-video.mp4");

          // Clean up virtual FS
          await ff.deleteFile(inFile).catch(function () {});
          for (var j = 0; j < partFiles.length; j++) {
            await ff.deleteFile(partFiles[j]).catch(function () {});
          }
          await ff.deleteFile("list.txt").catch(function () {});
          await ff.deleteFile(outputName).catch(function () {});
        } catch (err) {
          log("FFmpeg error: " + err.message);
          alert("Export failed: " + err.message);
        }

        recording = false;
        downloadBtn.disabled = false;
        downloadStatus.classList.add("hidden");
      }

      // Trigger a file download from a Blob
      function triggerBlobDownload(blob, filename) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      /* ---------- MediaRecorder fallback ---------- */

      // Hidden canvas used to mirror the video for recording
      var recCanvas = document.createElement("canvas");
      var recCtx = recCanvas.getContext("2d");

      function downloadWithMediaRecorder() {
        log("MediaRecorder fallback");
        recCanvas.width = video.videoWidth;
        recCanvas.height = video.videoHeight;
        log("canvas size: " + recCanvas.width + "x" + recCanvas.height);

        var canvasStream = recCanvas.captureStream(30);
        log("canvasStream tracks: " + canvasStream.getTracks().map(function(t) { return t.kind + ":" + t.readyState; }).join(", "));

        // Try to grab audio from the video element
        try {
          var videoStream = video.captureStream ? video.captureStream() : (video.mozCaptureStream ? video.mozCaptureStream() : null);
          if (videoStream) {
            videoStream.getAudioTracks().forEach(function(t) { canvasStream.addTrack(t); });
          }
        } catch (err) {
          log("audio capture skipped: " + err.message);
        }

        // Pick a supported mime type
        var mimeTypes = ["video/mp4;codecs=avc1,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
        var mimeType = "";
        for (var i = 0; i < mimeTypes.length; i++) {
          if (MediaRecorder.isTypeSupported(mimeTypes[i])) { mimeType = mimeTypes[i]; break; }
        }
        if (!mimeType) {
          log("no supported mime type");
          alert("Your browser does not support recording video.");
          recording = false;
          downloadBtn.disabled = false;
          return;
        }
        log("using mimeType: " + mimeType);
        var ext = mimeType.startsWith("video/mp4") ? "mp4" : "webm";

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: mimeType });

        mediaRecorder.addEventListener("dataavailable", function (e) {
          if (e.data.size > 0) recordedChunks.push(e.data);
        });

        mediaRecorder.addEventListener("stop", function () {
          log("MediaRecorder stopped, chunks=" + recordedChunks.length);
          var blob = new Blob(recordedChunks, { type: mimeType });
          triggerBlobDownload(blob, "cut-video." + ext);
          recording = false;
          downloadStatus.classList.add("hidden");
          downloadBtn.disabled = false;
        });

        downloadStatus.textContent = "Recording…";
        downloadStatus.classList.remove("hidden");
        mediaRecorder.start(1000);
        log("MediaRecorder started");

        // Play preview and paint frames to canvas
        previewing = true;
        previewBtn.classList.add("hidden");
        stopPreviewBtn.classList.remove("hidden");

        var startIdx = 0;
        while (startIdx < segments.length && segments[startIdx].mode === "remove") startIdx++;
        if (startIdx >= segments.length) { finishRecorderDownload(); return; }
        playSegmentForRecorder(startIdx);
      }

      function playSegmentForRecorder(idx) {
        if (!previewing || idx >= segments.length) { finishRecorderDownload(); return; }

        var seg = segments[idx];
        if (seg.mode === "remove") { playSegmentForRecorder(idx + 1); return; }

        var rate = seg.mode === "slow" ? 0.5 : (seg.mode === "fast" ? 2 : 1);
        video.playbackRate = rate;
        video.currentTime = seg.start;
        video.play();

        function checkEnd() {
          if (!previewing) { finishRecorderDownload(); return; }
          recCtx.drawImage(video, 0, 0, recCanvas.width, recCanvas.height);
          updatePlayhead();
          if (video.currentTime >= seg.end - 0.01) {
            video.pause();
            playSegmentForRecorder(idx + 1);
            return;
          }
          previewRafId = requestAnimationFrame(checkEnd);
        }
        previewRafId = requestAnimationFrame(checkEnd);
      }

      function finishRecorderDownload() {
        stopPreview();
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
        }
      }

      /* ========================================
         Rendering
      ======================================== */

      // Mode labels and colors for the segment list
      var modeLabels = {
        normal: "Keep",
        remove: "Remove",
        slow: "0.5x Speed",
        fast: "2x Speed",
      };

      var modeColors = {
        normal: "var(--muted)",
        remove: "var(--danger)",
        slow: "var(--info)",
        fast: "var(--warning)",
      };

      function render() {
        renderTimeline();
        renderSegmentList();
      }

      // Render the visual timeline with segment blocks and markers
      function renderTimeline() {
        timelineBar.innerHTML = "";

        // Render segment blocks
        segments.forEach(function (seg) {
          var pct = ((seg.end - seg.start) / duration) * 100;
          var div = document.createElement("div");
          div.className = "timeline-segment";
          div.dataset.mode = seg.mode;
          div.style.width = pct + "%";
          timelineBar.appendChild(div);
        });

        // Remove old markers from timeline (not bar)
        timelineEl.querySelectorAll(".timeline-marker").forEach(function (el) {
          el.remove();
        });

        // Render marker handles
        markers.forEach(function (time, idx) {
          var pct = (time / duration) * 100;
          var markerEl = document.createElement("div");
          markerEl.className = "timeline-marker";
          markerEl.style.left = pct + "%";
          timelineEl.appendChild(markerEl);
          setupMarkerDrag(markerEl, idx);
        });

        updatePlayhead();
      }

      // Render the segment list below the timeline
      function renderSegmentList() {
        segmentListEl.innerHTML = "";

        if (segments.length === 0) return;

        segments.forEach(function (seg, idx) {
          var item = document.createElement("article");
          item.className = "segment-item";

          // Color indicator
          var color = document.createElement("span");
          color.className = "segment-color";
          color.style.background = modeColors[seg.mode];

          // Time range label
          var timeLabel = document.createElement("span");
          timeLabel.className = "segment-time";
          timeLabel.textContent =
            formatTimeShort(seg.start) + " – " + formatTimeShort(seg.end);

          // Mode selector
          var select = document.createElement("select");
          ["normal", "remove", "slow", "fast"].forEach(function (mode) {
            var opt = document.createElement("option");
            opt.value = mode;
            opt.textContent = modeLabels[mode];
            if (mode === seg.mode) opt.selected = true;
            select.appendChild(opt);
          });

          select.addEventListener("change", function () {
            segments[idx].mode = select.value;
            renderTimeline();
            renderSegmentList();
          });

          // Jump-to button
          var jumpBtn = document.createElement("button");
          jumpBtn.textContent = "Go";
          jumpBtn.title = "Jump to segment start";
          jumpBtn.style.width = "auto";
          jumpBtn.dataset.variant = "secondary";
          jumpBtn.addEventListener("click", function () {
            video.currentTime = seg.start;
            updatePlayhead();
          });

          item.appendChild(color);
          item.appendChild(timeLabel);
          item.appendChild(select);
          item.appendChild(jumpBtn);
          segmentListEl.appendChild(item);
        });
      }

      /* ========================================
         Keyboard Shortcuts
      ======================================== */

      document.addEventListener("keydown", function (e) {
        // Ignore when typing in inputs
        if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
        if (!duration) return;

        switch (e.key) {
          case "ArrowLeft":
            e.preventDefault();
            video.currentTime = Math.max(0, video.currentTime - FRAME_STEP);
            break;
          case "ArrowRight":
            e.preventDefault();
            video.currentTime = Math.min(duration, video.currentTime + FRAME_STEP);
            break;
          case "m":
            addMarkerBtn.click();
            break;
          case " ":
            e.preventDefault();
            if (video.paused) {
              video.play();
            } else {
              video.pause();
            }
            break;
        }
      });
    </script>
  </body>
</html>
