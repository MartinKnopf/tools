<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#574747" />
    <title>Connect 4</title>
    <link rel="manifest" href="../manifest.json" />
    <link rel="apple-touch-icon" href="../icons/icon-192.png" />
    <link rel="stylesheet" href="https://unpkg.com/@knadh/oat/oat.min.css" />
    <script src="https://unpkg.com/@knadh/oat/oat.min.js" defer></script>
    <link rel="stylesheet" href="../style.css" />
    <style>
      /* Mode / difficulty selector active states */
      .mode-selector button.active,
      .difficulty-selector button.active {
        opacity: 1;
      }
      .mode-selector button:not(.active),
      .difficulty-selector button:not(.active) {
        opacity: 0.5;
      }
      .mode-selector button,
      .difficulty-selector button {
        width: auto;
      }

      /* Status line keeps a stable height */
      .status {
        min-height: 1.8em;
      }

      /* Scoreboard layout */
      .scoreboard {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
      }
      .score-item {
        text-align: center;
      }
      .score-label {
        color: var(--muted-foreground);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .score-value.red { color: #e74c3c; }
      .score-value.yellow { color: #f1c40f; }
      .score-value.draw { color: var(--muted-foreground); }

      /* Board wrapper keeps the 7:6 board centred and responsive */
      .c4-wrapper {
        max-width: 460px;
        width: 100%;
        margin: 0 auto;
      }

      /* Game-view header: back button on the left, new game on the right */
      .game-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 460px;
        margin: 0 auto var(--space-3);
      }
      .game-header button { width: auto; }

      /* Dialog content padding (oat sets dialog padding to 0) */
      #confirmDialog {
        padding: var(--space-4);
      }
      #confirmDialog p {
        margin-top: 0;
      }

      /* Board: horizontal flex row of 7 column containers */
      .c4-board {
        display: flex;
        gap: 6px;
        background: var(--card);
        border: 2px solid var(--border);
        border-radius: var(--radius-medium);
        padding: 8px;
        aspect-ratio: 7 / 6;
        --current-color: #e74c3c;
      }
      .c4-board.yellow-turn {
        --current-color: #f1c40f;
      }

      /* Each column stacks 6 cells */
      .c4-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
        cursor: pointer;
        border-radius: var(--radius-small);
        -webkit-tap-highlight-color: transparent;
        transition: background 0.15s ease;
        min-width: 0;
      }
      .c4-col.full,
      .c4-col.disabled {
        cursor: default;
      }
      .c4-col:hover:not(.full):not(.disabled) {
        background: color-mix(in srgb, var(--primary) 15%, transparent);
      }

      /* Circular slots */
      .c4-cell {
        flex: 1;
        aspect-ratio: 1;
        background: var(--background);
        border-radius: 50%;
        position: relative;
        overflow: hidden;
      }

      /* Piece (coloured disc) sits inside the cell */
      .c4-piece {
        position: absolute;
        inset: 8%;
        border-radius: 50%;
        box-sizing: border-box;
      }
      .c4-piece.red {
        background: radial-gradient(circle at 30% 30%, #ff6b5b, #c0392b);
      }
      .c4-piece.yellow {
        background: radial-gradient(circle at 30% 30%, #ffe066, #d4a017);
      }

      /* Drop-in animation: piece falls from above the board */
      @keyframes pieceDrop {
        0% { transform: translateY(var(--drop-from, -500%)); }
        85% { transform: translateY(8%); }
        100% { transform: translateY(0); }
      }
      .c4-piece.dropping {
        animation: pieceDrop 0.45s cubic-bezier(0.4, 0, 0.6, 1.05);
      }

      /* Row clearing flash (tetris-style) */
      @keyframes clearFlash {
        0%, 100% { opacity: 1; transform: scale(1); }
        20%, 60% { opacity: 0.25; transform: scale(1.08); }
        40%, 80% { opacity: 1; transform: scale(1); }
      }
      .c4-cell.clearing .c4-piece {
        animation: clearFlash 0.6s ease-in-out;
      }

      /* Winning pieces pulse */
      @keyframes winPulse {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.85);
        }
        50% {
          transform: scale(1.08);
          box-shadow: 0 0 0 6px rgba(46, 204, 113, 0.35);
        }
      }
      .c4-cell.win .c4-piece {
        animation: winPulse 0.8s ease-in-out infinite;
      }

      /* Hover preview: a faint disc in the landing slot */
      .c4-cell.preview::after {
        content: '';
        position: absolute;
        inset: 8%;
        border-radius: 50%;
        background: var(--current-color);
        opacity: 0.3;
        pointer-events: none;
      }
    </style>
  </head>
  <body data-theme="dark">
    <main class="container text-center">
      <!-- View: Main menu -->
      <section id="viewMenu">
        <h1>Connect 4</h1>

        <!-- Scoreboard (only shown in the main menu) -->
        <div class="scoreboard">
          <div class="score-item">
            <div class="score-label">Red</div>
            <div class="score-value red" id="scoreRed">0</div>
          </div>
          <div class="score-item">
            <div class="score-label">Draw</div>
            <div class="score-value draw" id="scoreDraw">0</div>
          </div>
          <div class="score-item">
            <div class="score-label">Yellow</div>
            <div class="score-value yellow" id="scoreYellow">0</div>
          </div>
        </div>

        <div class="menu-actions flex gap-md justify-center flex-wrap" style="margin-top: var(--space-5);">
          <button id="btnVsBot">vs Bot</button>
          <button id="btnVsHuman">vs Human</button>
        </div>
        <div class="menu-actions flex gap-md justify-center flex-wrap" style="margin-top: var(--space-3);">
          <button id="btnResetScores" class="outline">Reset Scores</button>
        </div>
      </section>

      <!-- View: Difficulty selection (bot only) -->
      <section id="viewDifficulty" class="view-hidden">
        <h2>Choose difficulty</h2>
        <div class="menu-actions flex gap-md justify-center flex-wrap" style="margin-top: var(--space-4);">
          <button id="btnEasy">Easy</button>
          <button id="btnHard">Hard</button>
        </div>
        <div class="menu-actions flex gap-md justify-center flex-wrap" style="margin-top: var(--space-3);">
          <button id="btnDifficultyBack" class="outline">Back</button>
        </div>
      </section>

      <!-- View: Game board -->
      <section id="viewGame" class="view-hidden">
        <div class="game-header">
          <button id="btnBack" class="outline">← Back</button>
          <button id="btnNewGame" class="outline">New Game</button>
        </div>

        <div class="c4-wrapper">
          <div class="c4-board" id="board"></div>
        </div>
      </section>
    </main>

    <!-- Back-to-menu confirmation dialog -->
    <dialog id="confirmDialog">
      <p>End the current game and return to the main menu?</p>
      <div class="dialog-actions">
        <button id="btnConfirmBack">End Game</button>
        <button id="btnCancelBack" class="outline">Keep Playing</button>
      </div>
    </dialog>

    <script>
      /* ===========================
         Constants
         =========================== */
      var ROWS = 6;
      var COLS = 7;
      var STORAGE_KEY = 'connect4_state';
      var HUMAN_COLOR = 'red';   // in bot mode, the human is always red (moves first)
      var BOT_COLOR = 'yellow';

      /* ===========================
         Game state
         =========================== */
      var board = createEmptyBoard();
      var currentPlayer = 'red';   // 'red' or 'yellow'
      var gameOver = false;
      var mode = 'bot';            // 'bot' or 'human'
      var difficulty = 'hard';     // 'easy' or 'hard'
      var scores = { red: 0, yellow: 0, draw: 0 };
      var busy = false;            // true during animations / bot thinking
      /* Session token: bumped whenever a game is started or abandoned, so
         pending setTimeout callbacks from a previous session can detect
         that the world has moved on and bail out. */
      var sessionId = 0;

      /* ===========================
         DOM references
         =========================== */
      var boardEl = document.getElementById('board');
      /* Status messages are no-ops since the status row was removed; win/draw is conveyed via piece pulse animation */
      var statusEl = document.createElement('div');
      var scoreRedEl = document.getElementById('scoreRed');
      var scoreYellowEl = document.getElementById('scoreYellow');
      var scoreDrawEl = document.getElementById('scoreDraw');
      var btnVsBot = document.getElementById('btnVsBot');
      var btnVsHuman = document.getElementById('btnVsHuman');
      var btnEasy = document.getElementById('btnEasy');
      var btnHard = document.getElementById('btnHard');
      var btnDifficultyBack = document.getElementById('btnDifficultyBack');
      var btnNewGame = document.getElementById('btnNewGame');
      var btnResetScores = document.getElementById('btnResetScores');
      var btnBack = document.getElementById('btnBack');
      var viewMenu = document.getElementById('viewMenu');
      var viewDifficulty = document.getElementById('viewDifficulty');
      var viewGame = document.getElementById('viewGame');
      var confirmDialog = document.getElementById('confirmDialog');
      var btnConfirmBack = document.getElementById('btnConfirmBack');
      var btnCancelBack = document.getElementById('btnCancelBack');

      /* Cell element cache populated in buildBoard() */
      var cells = [];
      var cols = [];

      /* ===========================
         Persistence
         =========================== */
      function saveState() {
        var state = { scores: scores, mode: mode, difficulty: difficulty };
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) { /* ignore quota errors */ }
      }

      function loadState() {
        try {
          var state = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (state) {
            scores = state.scores || { red: 0, yellow: 0, draw: 0 };
            mode = state.mode || 'bot';
            difficulty = state.difficulty || 'hard';
          }
        } catch (e) { /* ignore */ }
      }

      /* ===========================
         Board helpers (pure)
         =========================== */
      function createEmptyBoard() {
        var b = [];
        for (var r = 0; r < ROWS; r++) {
          b.push(new Array(COLS).fill(''));
        }
        return b;
      }

      function cloneBoard(b) {
        return b.map(function (row) { return row.slice(); });
      }

      /* Drop a piece in column `col`, returning the row it landed on. */
      function dropPiece(b, col, player) {
        for (var r = ROWS - 1; r >= 0; r--) {
          if (!b[r][col]) {
            b[r][col] = player;
            return r;
          }
        }
        return -1;
      }

      function canDrop(b, col) {
        return !b[0][col];
      }

      /* Return the lowest empty row in a column, or -1 if full. */
      function landingRow(b, col) {
        for (var r = ROWS - 1; r >= 0; r--) {
          if (!b[r][col]) return r;
        }
        return -1;
      }

      function isBoardFull(b) {
        for (var c = 0; c < COLS; c++) {
          if (!b[0][c]) return false;
        }
        return true;
      }

      /* Check for any 4-in-a-row. Returns { player, cells: [[r,c], ...] } or null. */
      function checkWin(b) {
        var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
        for (var r = 0; r < ROWS; r++) {
          for (var c = 0; c < COLS; c++) {
            if (!b[r][c]) continue;
            var p = b[r][c];
            for (var d = 0; d < dirs.length; d++) {
              var dr = dirs[d][0], dc = dirs[d][1];
              var cells4 = [[r, c]];
              var ok = true;
              for (var i = 1; i < 4; i++) {
                var nr = r + dr * i, nc = c + dc * i;
                if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS || b[nr][nc] !== p) {
                  ok = false;
                  break;
                }
                cells4.push([nr, nc]);
              }
              if (ok) return { player: p, cells: cells4 };
            }
          }
        }
        return null;
      }

      /* Return indices of rows that are completely filled. */
      function getFilledRows(b) {
        var filled = [];
        for (var r = 0; r < ROWS; r++) {
          var full = true;
          for (var c = 0; c < COLS; c++) {
            if (!b[r][c]) { full = false; break; }
          }
          if (full) filled.push(r);
        }
        return filled;
      }

      /* Remove the given rows and prepend empty rows on top — tetris-style. */
      function clearRowsFromBoard(b, rowsToRemove) {
        var removed = {};
        for (var i = 0; i < rowsToRemove.length; i++) removed[rowsToRemove[i]] = true;
        var newBoard = [];
        for (var r = 0; r < ROWS; r++) {
          if (!removed[r]) newBoard.push(b[r]);
        }
        while (newBoard.length < ROWS) {
          newBoard.unshift(new Array(COLS).fill(''));
        }
        return newBoard;
      }

      /* ===========================
         DOM: build the board once
         =========================== */
      function buildBoard() {
        boardEl.innerHTML = '';
        cells = [];
        cols = [];
        for (var r = 0; r < ROWS; r++) cells.push(new Array(COLS).fill(null));

        for (var c = 0; c < COLS; c++) {
          var colEl = document.createElement('div');
          colEl.className = 'c4-col';
          colEl.dataset.col = c;

          for (var r2 = 0; r2 < ROWS; r2++) {
            var cellEl = document.createElement('div');
            cellEl.className = 'c4-cell';
            cellEl.dataset.row = r2;
            cellEl.dataset.col = c;
            colEl.appendChild(cellEl);
            cells[r2][c] = cellEl;
          }

          /* Attach column-level interactions */
          (function (colIndex, colElement) {
            colElement.addEventListener('click', function () {
              handleHumanDrop(colIndex);
            });
            colElement.addEventListener('mouseenter', function () {
              setHoverColumn(colIndex);
            });
            colElement.addEventListener('mouseleave', function () {
              setHoverColumn(-1);
            });
          })(c, colEl);

          cols.push(colEl);
          boardEl.appendChild(colEl);
        }
      }

      /* Get a cached cell element */
      function getCell(r, c) { return cells[r][c]; }

      /* ===========================
         Rendering
         =========================== */
      function renderBoard() {
        for (var r = 0; r < ROWS; r++) {
          for (var c = 0; c < COLS; c++) {
            var cell = getCell(r, c);
            cell.innerHTML = '';
            cell.classList.remove('win', 'clearing', 'preview');
            if (board[r][c]) {
              var piece = document.createElement('div');
              piece.className = 'c4-piece ' + board[r][c];
              cell.appendChild(piece);
            }
          }
        }
        updateColumnStates();
        updateTurnColorClass();
      }

      /* Place a new piece into the DOM with a drop animation */
      function placePieceWithDrop(row, col, player) {
        var cell = getCell(row, col);
        cell.innerHTML = '';
        var piece = document.createElement('div');
        piece.className = 'c4-piece ' + player + ' dropping';
        /* Higher landing row → shorter visual fall */
        var dropFrom = -((row + 2) * 110);
        piece.style.setProperty('--drop-from', dropFrom + '%');
        cell.appendChild(piece);
      }

      /* Mark columns that are full as disabled for hover styling */
      function updateColumnStates() {
        for (var c = 0; c < COLS; c++) {
          if (!canDrop(board, c)) {
            cols[c].classList.add('full');
          } else {
            cols[c].classList.remove('full');
          }
          if (gameOver || busy || (mode === 'bot' && currentPlayer !== HUMAN_COLOR)) {
            cols[c].classList.add('disabled');
          } else {
            cols[c].classList.remove('disabled');
          }
        }
      }

      /* Switch the board's current-color CSS variable for the hover preview */
      function updateTurnColorClass() {
        if (currentPlayer === 'yellow') {
          boardEl.classList.add('yellow-turn');
        } else {
          boardEl.classList.remove('yellow-turn');
        }
      }

      /* Scoreboard (only visible on the main menu) */
      function updateScoreboard() {
        scoreRedEl.textContent = scores.red;
        scoreYellowEl.textContent = scores.yellow;
        scoreDrawEl.textContent = scores.draw;
      }

      /* ===========================
         View switching
         =========================== */
      function showView(name) {
        viewMenu.classList.toggle('view-hidden', name !== 'menu');
        viewDifficulty.classList.toggle('view-hidden', name !== 'difficulty');
        viewGame.classList.toggle('view-hidden', name !== 'game');
        if (name === 'menu') updateScoreboard();
      }

      function updateStatus() {
        if (gameOver) return;
        if (mode === 'bot') {
          statusEl.textContent = currentPlayer === HUMAN_COLOR
            ? 'Your turn (Red)'
            : 'Bot is thinking...';
        } else {
          var name = currentPlayer === 'red' ? 'Red' : 'Yellow';
          statusEl.textContent = name + "'s turn";
        }
      }

      /* ===========================
         Hover preview
         =========================== */
      var hoverCol = -1;

      function setHoverColumn(c) {
        hoverCol = c;
        updateHoverPreview();
      }

      function updateHoverPreview() {
        /* Clear all previews */
        for (var r = 0; r < ROWS; r++) {
          for (var c = 0; c < COLS; c++) {
            cells[r][c].classList.remove('preview');
          }
        }
        if (hoverCol < 0 || gameOver || busy) return;
        if (mode === 'bot' && currentPlayer !== HUMAN_COLOR) return;
        var landing = landingRow(board, hoverCol);
        if (landing < 0) return;
        getCell(landing, hoverCol).classList.add('preview');
      }

      /* ===========================
         Game flow
         =========================== */
      function handleHumanDrop(col) {
        if (gameOver || busy) return;
        if (mode === 'bot' && currentPlayer !== HUMAN_COLOR) return;
        if (!canDrop(board, col)) return;
        performDrop(col);
      }

      function performDrop(col) {
        busy = true;
        setHoverColumn(-1);
        var r = dropPiece(board, col, currentPlayer);
        if (r < 0) { busy = false; return; }
        placePieceWithDrop(r, col, currentPlayer);
        updateColumnStates();

        /* Wait for drop animation to settle, then resolve consequences */
        scheduleInSession(processAfterMove, 470);
      }

      /* setTimeout wrapper that drops the callback if the game session
         changed (user backed out, started a new game, etc.). */
      function scheduleInSession(fn, ms) {
        var s = sessionId;
        setTimeout(function () {
          if (s !== sessionId) return;
          fn();
        }, ms);
      }

      function processAfterMove() {
        /* 1) Immediate win from the last placement */
        var win = checkWin(board);
        if (win) { endGame(win); return; }

        /* 2) Clear any fully filled rows, then cascade (recheck for wins / clears) */
        var filled = getFilledRows(board);
        if (filled.length > 0) {
          var s = sessionId;
          animateClearRows(filled, function () {
            if (s !== sessionId) return;
            board = clearRowsFromBoard(board, filled);
            renderBoard();
            /* A cascade may have produced a new win or more full rows */
            scheduleInSession(processAfterMove, 300);
          });
          return;
        }

        /* 3) Draw if the board is full (no legal moves) */
        if (isBoardFull(board)) { endDraw(); return; }

        /* 4) Switch turns */
        currentPlayer = currentPlayer === 'red' ? 'yellow' : 'red';
        updateTurnColorClass();
        updateStatus();
        busy = false;
        updateColumnStates();
        updateHoverPreview();

        /* 5) Bot move */
        if (mode === 'bot' && currentPlayer !== HUMAN_COLOR) {
          busy = true;
          updateColumnStates();
          scheduleInSession(botMove, 500);
        }
      }

      function animateClearRows(rows, done) {
        var marked = [];
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          for (var c = 0; c < COLS; c++) {
            var cell = getCell(r, c);
            cell.classList.add('clearing');
            marked.push(cell);
          }
        }
        setTimeout(function () {
          for (var i = 0; i < marked.length; i++) {
            marked[i].classList.remove('clearing');
          }
          done();
        }, 620);
      }

      function endGame(result) {
        gameOver = true;
        busy = false;
        scores[result.player]++;
        updateScoreboard();
        saveState();

        /* Highlight the four winning cells */
        for (var i = 0; i < result.cells.length; i++) {
          var rc = result.cells[i];
          getCell(rc[0], rc[1]).classList.add('win');
        }

        if (mode === 'bot') {
          statusEl.textContent = result.player === HUMAN_COLOR ? 'You win!' : 'Bot wins!';
        } else {
          var name = result.player === 'red' ? 'Red' : 'Yellow';
          statusEl.textContent = name + ' wins!';
        }
        updateColumnStates();
        setHoverColumn(-1);
      }

      function endDraw() {
        gameOver = true;
        busy = false;
        scores.draw++;
        updateScoreboard();
        saveState();
        statusEl.textContent = "It's a draw!";
        updateColumnStates();
        setHoverColumn(-1);
      }

      function newGame() {
        sessionId++;
        board = createEmptyBoard();
        currentPlayer = 'red';
        gameOver = false;
        busy = false;
        renderBoard();
        updateStatus();
        updateColumnStates();
        /* In bot mode the human always opens as Red, so no immediate bot move */
      }

      function resetScores() {
        scores = { red: 0, yellow: 0, draw: 0 };
        updateScoreboard();
        saveState();
      }

      /* ===========================
         Bot AI
         =========================== */
      function botMove() {
        if (gameOver) { busy = false; return; }
        var col = difficulty === 'easy' ? botEasy() : botHard();
        if (col < 0) { busy = false; return; }
        performDrop(col);
      }

      /* Easy: random legal column */
      function botEasy() {
        var valid = [];
        for (var c = 0; c < COLS; c++) {
          if (canDrop(board, c)) valid.push(c);
        }
        if (!valid.length) return -1;
        return valid[Math.floor(Math.random() * valid.length)];
      }

      /* ---------------------------
         Hard mode: negamax search with alpha-beta pruning,
         center-first move ordering, iterative deepening
         under a soft time budget, and cascade-aware
         simulation (row clears can themselves create wins).
         --------------------------- */
      var WIN_SCORE = 1000000;
      var SEARCH_TIME_BUDGET_MS = 900;
      var MAX_SEARCH_DEPTH = 9;
      /* Search center columns first — they cut more lines, so alpha-beta
         prunes a lot more of the tree when the strong move is tried first. */
      var MOVE_ORDER = [3, 2, 4, 1, 5, 0, 6];

      function opponentOf(player) {
        return player === 'red' ? 'yellow' : 'red';
      }

      function legalMovesOrdered(b) {
        var moves = [];
        for (var i = 0; i < MOVE_ORDER.length; i++) {
          var c = MOVE_ORDER[i];
          if (canDrop(b, c)) moves.push(c);
        }
        return moves;
      }

      /* Apply a move plus any cascade of row clears. Returns
         { board, winner }. winner is set if the dropping player
         lines up four either before or after any clear step. */
      function simulateMove(b, col, player) {
        var sim = cloneBoard(b);
        var r = dropPiece(sim, col, player);
        if (r < 0) return null;
        var w = checkWin(sim);
        if (w) return { board: sim, winner: w.player };
        while (true) {
          var filled = getFilledRows(sim);
          if (!filled.length) break;
          sim = clearRowsFromBoard(sim, filled);
          w = checkWin(sim);
          if (w) return { board: sim, winner: w.player };
        }
        return { board: sim, winner: null };
      }

      /* Count windows of 4 with `own` pieces of `player` and the rest empty.
         Used as a weighted threat count. */
      function evaluateBoard(b, player) {
        var opp = opponentOf(player);
        return scoreFor(b, player) - scoreFor(b, opp);
      }

      function scoreFor(b, player) {
        var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
        var score = 0;
        /* Center-column control is worth a flat bonus per piece. */
        for (var rr = 0; rr < ROWS; rr++) {
          if (b[rr][3] === player) score += 4;
        }
        for (var r = 0; r < ROWS; r++) {
          for (var c = 0; c < COLS; c++) {
            for (var d = 0; d < dirs.length; d++) {
              var dr = dirs[d][0], dc = dirs[d][1];
              var endR = r + dr * 3, endC = c + dc * 3;
              if (endR < 0 || endR >= ROWS || endC < 0 || endC >= COLS) continue;
              var own = 0, empty = 0;
              for (var i = 0; i < 4; i++) {
                var v = b[r + dr * i][c + dc * i];
                if (v === player) own++;
                else if (!v) empty++;
              }
              if (own + empty < 4) continue; /* mixed window — useless to either side */
              if (own === 4) score += 100000;
              else if (own === 3 && empty === 1) score += 50;
              else if (own === 2 && empty === 2) score += 5;
              else if (own === 1 && empty === 3) score += 1;
            }
          }
        }
        return score;
      }

      /* Negamax framework: at every node, score the current position
         from `player`'s perspective. Children are evaluated as
         the negation of the opponent's best reply. Alpha-beta cuts
         off branches that can't improve on the current bound. */
      function negamax(b, depth, alpha, beta, player, deadline) {
        if (Date.now() > deadline) return evaluateBoard(b, player); /* soft timeout */
        if (depth === 0) return evaluateBoard(b, player);
        if (isBoardFull(b)) return 0;

        var legal = legalMovesOrdered(b);
        if (!legal.length) return 0;

        var best = -Infinity;
        var opp = opponentOf(player);
        for (var i = 0; i < legal.length; i++) {
          var sim = simulateMove(b, legal[i], player);
          if (!sim) continue;
          var score;
          if (sim.winner === player) {
            /* Prefer faster wins / slower losses by encoding depth. */
            score = WIN_SCORE - (MAX_SEARCH_DEPTH - depth);
          } else if (sim.winner === opp) {
            score = -(WIN_SCORE - (MAX_SEARCH_DEPTH - depth));
          } else {
            score = -negamax(sim.board, depth - 1, -beta, -alpha, opp, deadline);
          }
          if (score > best) best = score;
          if (best > alpha) alpha = best;
          if (alpha >= beta) break; /* beta cutoff */
        }
        return best;
      }

      /* Hard: iteratively deepen until the time budget is used up.
         Among moves that score within EPSILON of the best, pick
         randomly so the bot doesn't replay the same opening forever. */
      function botHard() {
        var rootMoves = legalMovesOrdered(board);
        if (!rootMoves.length) return -1;

        /* Forced-win shortcut: if any move wins outright now, take it. */
        for (var w = 0; w < rootMoves.length; w++) {
          var s = simulateMove(board, rootMoves[w], BOT_COLOR);
          if (s && s.winner === BOT_COLOR) return rootMoves[w];
        }

        var deadline = Date.now() + SEARCH_TIME_BUDGET_MS;
        var bestScores = rootMoves.map(function () { return 0; });
        var completedDepth = 0;

        for (var depth = 2; depth <= MAX_SEARCH_DEPTH; depth++) {
          var iterScores = new Array(rootMoves.length);
          var alpha = -Infinity;
          var beta = Infinity;
          var timedOut = false;

          for (var i = 0; i < rootMoves.length; i++) {
            if (Date.now() > deadline && i > 0) { timedOut = true; break; }
            var sim = simulateMove(board, rootMoves[i], BOT_COLOR);
            var score;
            if (!sim) score = -Infinity;
            else if (sim.winner === BOT_COLOR) score = WIN_SCORE;
            else if (sim.winner === HUMAN_COLOR) score = -WIN_SCORE;
            else score = -negamax(sim.board, depth - 1, -beta, -alpha, HUMAN_COLOR, deadline);
            iterScores[i] = score;
            if (score > alpha) alpha = score;
          }

          if (timedOut) break;
          bestScores = iterScores;
          completedDepth = depth;

          /* Stop early if a forced result is already known. */
          var maxSeen = -Infinity;
          for (var m = 0; m < bestScores.length; m++) {
            if (bestScores[m] > maxSeen) maxSeen = bestScores[m];
          }
          if (maxSeen >= WIN_SCORE - 1000) break;
          if (maxSeen <= -(WIN_SCORE - 1000)) break;
        }

        /* Pick among near-best moves with a small epsilon so opening play varies. */
        var topScore = -Infinity;
        for (var n = 0; n < bestScores.length; n++) {
          if (bestScores[n] > topScore) topScore = bestScores[n];
        }
        var EPSILON = Math.abs(topScore) >= WIN_SCORE - 1000 ? 0 : 6;
        var candidates = [];
        for (var p = 0; p < rootMoves.length; p++) {
          if (bestScores[p] >= topScore - EPSILON) candidates.push(rootMoves[p]);
        }
        if (!candidates.length) candidates = rootMoves.slice(0, 1);
        return candidates[Math.floor(Math.random() * candidates.length)];
      }

      /* ===========================
         Navigation
         =========================== */
      function startGame() {
        saveState();
        showView('game');
        newGame();
      }

      function backToMenu() {
        /* Bump the session so any pending bot/animation timer is dropped */
        sessionId++;
        gameOver = true;
        busy = false;
        showView('menu');
      }

      /* ===========================
         Event listeners
         =========================== */
      btnVsBot.addEventListener('click', function () {
        mode = 'bot';
        showView('difficulty');
      });
      btnVsHuman.addEventListener('click', function () {
        mode = 'human';
        startGame();
      });
      btnEasy.addEventListener('click', function () {
        difficulty = 'easy';
        startGame();
      });
      btnHard.addEventListener('click', function () {
        difficulty = 'hard';
        startGame();
      });
      btnDifficultyBack.addEventListener('click', function () {
        showView('menu');
      });
      btnNewGame.addEventListener('click', newGame);
      btnResetScores.addEventListener('click', resetScores);

      /* Back from game → confirm before abandoning */
      btnBack.addEventListener('click', function () {
        /* Skip the confirm if the game is already finished */
        if (gameOver) { backToMenu(); return; }
        if (typeof confirmDialog.showModal === 'function') {
          confirmDialog.showModal();
        } else if (window.confirm('End the current game and return to the main menu?')) {
          backToMenu();
        }
      });
      btnConfirmBack.addEventListener('click', function () {
        confirmDialog.close();
        backToMenu();
      });
      btnCancelBack.addEventListener('click', function () {
        confirmDialog.close();
      });

      /* ===========================
         Initialize
         =========================== */
      loadState();
      buildBoard();
      updateScoreboard();
      /* Start on the main menu — no game in progress yet */
      gameOver = true;
      showView('menu');
    </script>
  </body>
</html>
