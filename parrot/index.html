<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parrot</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      /* ========================================
         Layout
      ======================================== */
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
        margin: 0;
        overflow: hidden;
        background: #1a1a2e;
        color: #e0e0e0;
      }

      .parrot-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        text-align: center;
        padding: 2rem;
      }

      /* ========================================
         Parrot Indicator
      ======================================== */
      .parrot {
        font-size: 8rem;
        line-height: 1;
        transition: transform 0.2s ease, filter 0.2s ease;
        filter: grayscale(0.8) brightness(0.6);
        user-select: none;
      }

      .parrot.listening {
        filter: grayscale(0.4) brightness(0.8);
        animation: bob 1.5s ease-in-out infinite;
      }

      .parrot.recording {
        filter: grayscale(0) brightness(1);
        animation: bounce 0.4s ease-in-out infinite;
      }

      .parrot.playing {
        filter: grayscale(0) brightness(1) hue-rotate(20deg);
        animation: dance 0.3s ease-in-out infinite alternate;
      }

      /* ========================================
         Animations
      ======================================== */
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      @keyframes bounce {
        0%, 100% { transform: scale(1) translateY(0); }
        50% { transform: scale(1.08) translateY(-10px); }
      }

      @keyframes dance {
        0% { transform: rotate(-5deg) scale(1.05); }
        100% { transform: rotate(5deg) scale(1.1); }
      }

      /* ========================================
         Status Text
      ======================================== */
      .status {
        font-size: 1.2rem;
        min-height: 2em;
        opacity: 0.85;
      }

      /* ========================================
         Volume Meter
      ======================================== */
      .volume-bar-container {
        width: 200px;
        height: 8px;
        background: #333;
        border-radius: 4px;
        overflow: hidden;
      }

      .volume-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4caf50, #ff9800, #f44336);
        border-radius: 4px;
        transition: width 0.05s linear;
      }

      /* ========================================
         Playback Progress Bar
      ======================================== */
      .playback-bar-container {
        width: 200px;
        height: 8px;
        background: #333;
        border-radius: 4px;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .playback-bar-container.visible {
        opacity: 1;
      }

      .playback-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #64b5f6, #ba68c8);
        border-radius: 4px;
      }

      .playback-time {
        font-size: 0.9rem;
        opacity: 0;
        min-height: 1.4em;
        transition: opacity 0.2s ease;
      }

      .playback-time.visible {
        opacity: 0.7;
      }

      /* ========================================
         Error State
      ======================================== */
      .error {
        color: #f44336;
      }
    </style>
  </head>
  <body>
    <main class="parrot-container">
      <div class="parrot" id="parrot">🦜</div>
      <div class="status" id="status">Initializing microphone…</div>
      <div class="volume-bar-container">
        <div class="volume-bar" id="volume-bar"></div>
      </div>
      <div class="playback-bar-container" id="playback-bar-container">
        <div class="playback-bar" id="playback-bar"></div>
      </div>
      <div class="playback-time" id="playback-time"></div>
    </main>

    <script>
      (function () {
        'use strict';

        /* ========================================
           Constants
        ======================================== */
        const SPEECH_THRESHOLD = 0.15;       // RMS level to trigger recording
        const SILENCE_THRESHOLD = 0.06;      // RMS level below which silence is detected
        const SILENCE_TIMEOUT_MS = 1000;     // Stop recording after this long below silence threshold
        const PITCH_SHIFT = 1.5;             // Playback speed multiplier for higher pitch
        const ANALYSIS_INTERVAL_MS = 50;     // How often to check volume
        const PRE_BUFFER_MS = 300;           // Audio to keep before speech detection
        const TIMESLICE_MS = 100;            // MediaRecorder chunk interval
        const PRE_BUFFER_CHUNKS = Math.ceil(PRE_BUFFER_MS / TIMESLICE_MS);

        /* ========================================
           DOM References
        ======================================== */
        const parrotEl = document.getElementById('parrot');
        const statusEl = document.getElementById('status');
        const volumeBar = document.getElementById('volume-bar');
        const playbackBarContainer = document.getElementById('playback-bar-container');
        const playbackBar = document.getElementById('playback-bar');
        const playbackTimeEl = document.getElementById('playback-time');

        /* ========================================
           State
        ======================================== */
        let audioContext = null;
        let analyser = null;
        let mediaStream = null;
        let isRecording = false;
        let isPlaying = false;

        /* ========================================
           Helpers
        ======================================== */

        /** Set the visual state of the parrot */
        function setParrotState(state) {
          parrotEl.className = 'parrot';
          if (state) {
            parrotEl.classList.add(state);
          }
        }

        /** Calculate RMS volume from analyser data */
        function getRMS(dataArray) {
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            const normalized = dataArray[i] / 128.0 - 1.0;
            sum += normalized * normalized;
          }
          return Math.sqrt(sum / dataArray.length);
        }

        /** Update the volume meter bar */
        function updateVolumeMeter(rms) {
          const pct = Math.min(rms / 0.3 * 100, 100);
          volumeBar.style.width = pct + '%';
        }

        /* ========================================
           Audio Recording (with pre-buffer)
        ======================================== */

        /**
         * Runs a single listen → record cycle using one MediaRecorder.
         * During the listening phase, chunks are kept in a rolling pre-buffer.
         * When speech is detected the pre-buffer is preserved and recording
         * continues until silence persists for SILENCE_TIMEOUT_MS.
         * Returns a Blob that includes PRE_BUFFER_MS of audio before speech.
         */
        function listenAndRecord(stream) {
          return new Promise(function (resolve) {
            const recorder = new MediaRecorder(stream);
            const preBuffer = [];       // rolling buffer of recent chunks
            const recordingChunks = []; // chunks collected after speech detected
            let phase = 'listening';    // 'listening' or 'recording'
            let silenceStart = null;
            const dataArray = new Uint8Array(analyser.fftSize);

            recorder.ondataavailable = function (e) {
              if (e.data.size === 0) return;

              if (phase === 'listening') {
                preBuffer.push(e.data);
                if (preBuffer.length > PRE_BUFFER_CHUNKS) {
                  preBuffer.shift();
                }
              } else {
                recordingChunks.push(e.data);
              }
            };

            recorder.onstop = function () {
              /* Combine pre-buffer with recorded audio */
              const allChunks = preBuffer.concat(recordingChunks);
              const blob = new Blob(allChunks, { type: recorder.mimeType });
              resolve(blob);
            };

            /* Start recorder with timeslice so we get regular chunks */
            recorder.start(TIMESLICE_MS);

            setParrotState('listening');
            statusEl.textContent = 'Listening… speak to start recording!';

            /* Monitor volume to transition between phases */
            var checkInterval = setInterval(function () {
              if (recorder.state !== 'recording') {
                clearInterval(checkInterval);
                return;
              }

              analyser.getByteTimeDomainData(dataArray);
              var rms = getRMS(dataArray);
              updateVolumeMeter(rms);

              if (phase === 'listening') {
                /* Wait for speech to start */
                if (rms >= SPEECH_THRESHOLD) {
                  phase = 'recording';
                  isRecording = true;
                  setParrotState('recording');
                  statusEl.textContent = 'Recording…';
                  silenceStart = null;
                }
              } else {
                /* Recording phase — stop after sustained silence */
                if (rms < SILENCE_THRESHOLD) {
                  if (silenceStart === null) {
                    silenceStart = Date.now();
                  } else if (Date.now() - silenceStart >= SILENCE_TIMEOUT_MS) {
                    clearInterval(checkInterval);
                    recorder.stop();
                  }
                } else {
                  silenceStart = null;
                }
              }
            }, ANALYSIS_INTERVAL_MS);
          });
        }

        /** Format seconds as m:ss or s.s */
        function formatTime(seconds) {
          if (seconds < 10) {
            return seconds.toFixed(1) + 's';
          }
          var m = Math.floor(seconds / 60);
          var s = Math.floor(seconds % 60);
          return m + ':' + (s < 10 ? '0' : '') + s;
        }

        /** Show/hide playback progress UI */
        function setPlaybackUIVisible(visible) {
          if (visible) {
            playbackBarContainer.classList.add('visible');
            playbackTimeEl.classList.add('visible');
          } else {
            playbackBarContainer.classList.remove('visible');
            playbackTimeEl.classList.remove('visible');
            playbackBar.style.width = '0%';
            playbackTimeEl.textContent = '';
          }
        }

        /** Play back an audio blob with higher pitch using Web Audio API */
        function playWithHigherPitch(blob) {
          return new Promise(function (resolve, reject) {
            const reader = new FileReader();

            reader.onload = function () {
              const playbackContext = new (window.AudioContext || window.webkitAudioContext)();

              playbackContext.decodeAudioData(reader.result, function (audioBuffer) {
                /* Playback duration is shortened by the pitch shift */
                const playbackDuration = audioBuffer.duration / PITCH_SHIFT;

                const source = playbackContext.createBufferSource();
                source.buffer = audioBuffer;
                source.playbackRate.value = PITCH_SHIFT;
                source.connect(playbackContext.destination);

                /* Show playback progress bar and time */
                setPlaybackUIVisible(true);
                playbackTimeEl.textContent = '0.0s / ' + formatTime(playbackDuration);

                const startTime = Date.now();
                var progressInterval = setInterval(function () {
                  var elapsed = (Date.now() - startTime) / 1000;
                  var pct = Math.min(elapsed / playbackDuration * 100, 100);
                  playbackBar.style.width = pct + '%';
                  playbackTimeEl.textContent = formatTime(Math.min(elapsed, playbackDuration)) + ' / ' + formatTime(playbackDuration);
                }, 50);

                source.onended = function () {
                  clearInterval(progressInterval);
                  playbackBar.style.width = '100%';
                  playbackTimeEl.textContent = formatTime(playbackDuration) + ' / ' + formatTime(playbackDuration);

                  /* Brief pause before hiding so user sees completion */
                  setTimeout(function () {
                    setPlaybackUIVisible(false);
                    playbackContext.close();
                    resolve();
                  }, 400);
                };

                source.start(0);
              }, function (err) {
                setPlaybackUIVisible(false);
                playbackContext.close();
                reject(err);
              });
            };

            reader.onerror = function () {
              reject(reader.error);
            };

            reader.readAsArrayBuffer(blob);
          });
        }

        /* ========================================
           Main Loop: Listen → Record → Play → Repeat
        ======================================== */

        /** Full cycle: listen (with pre-buffer) → record → play back → repeat */
        async function runCycle() {
          try {
            /* Listen and record (includes pre-buffer) */
            const blob = await listenAndRecord(mediaStream);
            isRecording = false;

            /* Play back with higher pitch */
            isPlaying = true;
            setParrotState('playing');
            statusEl.textContent = 'Squawk! Playing back…';

            await playWithHigherPitch(blob);
          } catch (err) {
            console.error('Playback error:', err);
          }

          /* Reset and start next cycle */
          isPlaying = false;
          updateVolumeMeter(0);
          runCycle();
        }

        /* ========================================
           Initialization
        ======================================== */
        async function init() {
          try {
            /* Request microphone access */
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

            /* Set up audio analysis for volume detection */
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(mediaStream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            source.connect(analyser);

            /* Begin the listen → record → play loop */
            runCycle();
          } catch (err) {
            console.error('Microphone access error:', err);
            statusEl.textContent = 'Microphone access denied. Please allow microphone access and reload.';
            statusEl.classList.add('error');
            setParrotState(null);
          }
        }

        init();
      })();
    </script>
  </body>
</html>
